/* ===== js/09-mapa-editar.js ===== */
/* =====================================================================
   MAPA · ORGANIZAR ZONAS
   La distribución todavía no está definida (lo dijo la clienta), así que
   las zonas se pueden mover, agrandar, renombrar, pintar, pasar de piso,
   crear y borrar desde la página. Funciona con el mouse y con el dedo.
   ===================================================================== */
const EDIT_MAPA = { on:false, sel:null, arr:null };

function entrarEdicionMapa(){ EDIT_MAPA.on = true; EDIT_MAPA.sel = EST_MAPA.zona; EST_MAPA.destacar = null; RENDER.mapa(); }
function salirEdicionMapa(silencio){
  if (!EDIT_MAPA.on) return;
  EDIT_MAPA.on = false; EDIT_MAPA.arr = null;
  if (!silencio){ avisar('Mapa salvo'); RENDER.mapa(); }
}
function limitesPiso(piso){
  const c = PISOS[piso].contorno, xs = c.map(p => p[0]), ys = c.map(p => p[1]);
  return { x0:Math.min(...xs) + 10, y0:Math.min(...ys) + 10, x1:Math.max(...xs) - 10, y1:Math.max(...ys) - 10 };
}
const encaje = n => Math.round(n / 5) * 5;

function prepararEdicionMapa(){
  const svg = $('#mapa-svg'); if (!svg) return;
  // una manija en la esquina de abajo a la derecha de cada zona
  $$('#m-zonas .zona', svg).forEach(g => {
    const z = zona(g.dataset.id); if (!z) return;
    g.removeAttribute('onclick');
    const ns = 'http://www.w3.org/2000/svg', m = document.createElementNS(ns, 'circle');
    m.setAttribute('class', 'z-manija'); m.setAttribute('cx', z.x + z.w); m.setAttribute('cy', z.y + z.h); m.setAttribute('r', 20);
    g.appendChild(m);
  });
  const punto = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  svg.addEventListener('pointerdown', e => {
    const g = e.target.closest('.zona'); if (!g) return;
    const z = zona(g.dataset.id), p = punto(e);
    EDIT_MAPA.arr = { g, z, modo: e.target.classList.contains('z-manija') ? 'tam' : 'mover', p0:p, x:z.x, y:z.y, w:z.w, h:z.h, movio:false };
    svg.setPointerCapture(e.pointerId);
    g.classList.add('arrastrando');
    e.preventDefault();
  });
  svg.addEventListener('pointermove', e => {
    const a = EDIT_MAPA.arr; if (!a) return;
    const p = punto(e), dx = p.x - a.p0.x, dy = p.y - a.p0.y, L = limitesPiso(a.z.piso);
    if (Math.abs(dx) + Math.abs(dy) > 6) a.movio = true;
    if (!a.movio) return;
    if (a.modo === 'mover'){
      a.nx = encaje(Math.min(Math.max(a.x + dx, L.x0), L.x1 - a.w)); a.ny = encaje(Math.min(Math.max(a.y + dy, L.y0), L.y1 - a.h));
      a.g.setAttribute('transform', `translate(${a.nx - a.x} ${a.ny - a.y})`);
    } else {
      a.nw = encaje(Math.min(Math.max(a.w + dx, 120), L.x1 - a.x)); a.nh = encaje(Math.min(Math.max(a.h + dy, 100), L.y1 - a.y));
      a.g.querySelector('.z-fondo').setAttribute('width', a.nw); a.g.querySelector('.z-fondo').setAttribute('height', a.nh);
      const cab = a.g.querySelector('.z-cab'); if (cab) cab.style.display = 'none';
      const m = a.g.querySelector('.z-manija'); m.setAttribute('cx', a.x + a.nw); m.setAttribute('cy', a.y + a.nh);
      const lin = a.g.querySelector('.z-lineas'), pun = a.g.querySelector('.z-puntos'); if (lin) lin.style.opacity = .25; if (pun) pun.style.opacity = .25;
    }
  });
  const soltar = () => {
    const a = EDIT_MAPA.arr; if (!a) return; EDIT_MAPA.arr = null;
    a.g.classList.remove('arrastrando');
    if (!a.movio){ elegirZona(a.z.id); return; }
    if (a.modo === 'mover'){ a.z.x = a.nx; a.z.y = a.ny; } else { a.z.w = a.nw; a.z.h = a.nh; }
    EDIT_MAPA.sel = EST_MAPA.zona = a.z.id;
    registrar((a.modo === 'mover' ? 'Moveu' : 'Mudou o tamanho de') + ' a zona ' + a.z.nome);
    guardar(); RENDER.mapa();
  };
  svg.addEventListener('pointerup', soltar);
  svg.addEventListener('pointercancel', soltar);
}

/* ---------- Panel de la zona en edición ---------- */
function panelEdicion(){
  const z = zona(EDIT_MAPA.sel);
  if (!z) return `<div class="card"><div class="card-t">Organizar zonas</div>
    <ol class="pasos mt-s"><li><b>Arraste</b> uma zona para mudá-la de lugar.</li><li>Puxe a <b>bolinha do canto</b> para mudar o tamanho.</li>
      <li><b>Toque</b> numa zona para mudar o nome, a cor ou o andar.</li><li>Use <b>Nova zona</b> para criar outra (por exemplo, separar os tipos de embalagem).</li></ol>
    <div class="caja-info mt">${ico('info')}<span>Os produtos acompanham a zona: mudar o desenho não mexe no estoque.</span></div></div>`;
  const r = resumoZona(z.id), m2 = z.w * z.h / (PX_METRO * PX_METRO);
  return `<div class="card zona-det" style="--zc:${z.cor}">
    <div class="zd-cab"><span class="zd-cor"></span><div><div class="zd-piso">Editando a zona</div><h2>${esc(z.nome)}</h2></div>
      <button class="icon-btn" onclick="EDIT_MAPA.sel=null; EST_MAPA.zona=null; marcarZonaSel(); pintarPanelZona()" aria-label="Fechar">${ico('x')}</button></div>
    <div class="ed-fila"><span>Nome</span><button class="btn btn-linea btn-sm" onclick="renombrarZona('${z.id}')">${ico('editar')} Mudar o nome</button></div>
    <div class="ed-fila"><span>Cor</span><div class="ed-cores">${CORES_ZONA.map(c => `<button style="background:${c}" class="${c === z.cor ? 'on' : ''}" onclick="zonaProp('${z.id}', 'cor', '${c}')" aria-label="Cor ${c}"></button>`).join('')}</div></div>
    <div class="ed-fila"><span>Tipo</span><div class="segmento seg-chico"><button class="${z.apoio ? '' : 'on'}" onclick="zonaProp('${z.id}', 'apoio', false)">Estoque</button><button class="${z.apoio ? 'on' : ''}" onclick="zonaProp('${z.id}', 'apoio', true)">Área de apoio</button></div></div>
    <div class="ed-fila"><span>Andar</span><div class="segmento seg-chico">${Object.keys(PISOS).map(k => `<button class="${z.piso === k ? 'on' : ''}" onclick="zonaProp('${z.id}', 'piso', '${k}')">${PISOS[k].t}</button>`).join('')}</div></div>
    <div class="ed-fila"><span>Tamanho</span><b class="num">${cant(z.w / PX_METRO)} × ${cant(z.h / PX_METRO)} m · ${cant(Math.round(m2 * 10) / 10)} m²</b></div>
    <div class="ed-fila"><span>Conteúdo</span><span>${r.prods.length} produtos · ${cant(r.unidades)} unidades</span></div>
    <div class="zd-acc"><button class="btn btn-peligro btn-sm" onclick="borrarZona('${z.id}')">${ico('borrar')} Excluir zona</button></div></div>`;
}
async function renombrarZona(id){
  const z = zona(id), n = await pedirTexto('Nome da zona', z.nome, 'Nome');
  if (!n) return;
  registrar(`Renomeou a zona ${z.nome} para ${n}`); z.nome = n; guardar(); RENDER.mapa();
}
function zonaProp(id, k, v){
  const z = zona(id); z[k] = v;
  if (k === 'piso'){ const L = limitesPiso(v); z.x = Math.min(Math.max(z.x, L.x0), L.x1 - z.w); z.y = Math.min(Math.max(z.y, L.y0), L.y1 - z.h); EST_MAPA.piso = v; }
  guardar(); RENDER.mapa();
}
function nuevaZona(){
  const usados = D().zonas.map(z => z.cor), cor = CORES_ZONA.find(c => !usados.includes(c)) || CORES_ZONA[D().zonas.length % CORES_ZONA.length];
  const z = { id:Store.id('z'), piso:EST_MAPA.piso, nome:'Nova zona', cor, x:90, y:60, w:240, h:200 };
  D().zonas.push(z); EDIT_MAPA.sel = EST_MAPA.zona = z.id;
  registrar('Criou uma zona no ' + PISOS[z.piso].t);
  guardar(); RENDER.mapa(); renombrarZona(z.id);
}
async function borrarZona(id){
  const z = zona(id), r = resumoZona(id);
  if (r.unidades > 0 || D().produtos.some(p => p.zona === id)){
    await confirmar('Antes, esvazie a zona', `Em <b>${esc(z.nome)}</b> há ${r.prods.length} produto${r.prods.length > 1 ? 's' : ''}. Leve-os para outra zona (no mapa, «Trazer produto para cá») e depois exclua esta.`, 'Entendi');
    return;
  }
  if (!await confirmar('Excluir a zona?', `<b>${esc(z.nome)}</b> sai do mapa.`, 'Excluir', true)) return;
  D().zonas = D().zonas.filter(x => x.id !== id); EDIT_MAPA.sel = EST_MAPA.zona = null;
  registrar('Excluiu a zona ' + z.nome); guardar(); RENDER.mapa();
}


/* ===== js/10-vendas.js ===== */
/* =====================================================================
   VENDAS · faturamento
   Buscar por nome ou código, ou ler o código de barras (o leitor USB
   escreve como um teclado e termina com Enter; no celular, a câmera).
   Ao faturar, o estoque baixa SOZINHO da zona e do lote que vence antes,
   e o mapa mostra a nova quantidade.
   ⚠ La NF-e es SIMULADA en la demo: en la versión real se conecta con el
   emisor de notas que use la empresa (se cotiza aparte).
   ===================================================================== */
const EST_VENDAS = { tab:'caixa', periodo:'hoje', q:'', ver:60 };
let CARRO = { it:[], cli:null, desc:0 };
let _qPos = '';

RENDER.vendas = function(){
  const t = EST_VENDAS.tab;
  document.body.classList.toggle('en-pos', t === 'caixa');
  encabezado('Vendas', t === 'caixa' ? 'Busque o produto ou leia o código de barras. Ao faturar, o estoque baixa sozinho no mapa.' : 'Todas as vendas faturadas.',
    t === 'lista' ? btnExportar('exportarVendas') : `<button class="btn btn-linea" onclick="abrirEscaner('venda')">${ico('escanear')} Ler código</button>`);
  $('#vista').innerHTML = pestanas([['caixa', 'Caixa'], ['lista', 'Vendas feitas']], t, 'tabVendas') + '<div id="vendas-cuerpo"></div>';
  if (t === 'caixa') pintarCaixa(); else pintarListaVendas();
};
function tabVendas(t){ EST_VENDAS.tab = t; RENDER.vendas(); }
function nuevaVenta(){
  cerrarMenu();
  if (!puedeVer('vendas')){ error('O seu usuário não fatura vendas'); return; }
  EST_VENDAS.tab = 'caixa';
  if (seccionActual !== 'vendas') ir('vendas'); else RENDER.vendas();
  setTimeout(() => { const i = $('#pos-buscar'); if (i && window.innerWidth > 900) i.focus(); }, 60);
}

/* ---------- La caja ---------- */
function pintarCaixa(){
  $('#vendas-cuerpo').innerHTML = `<div class="pos-caja">
    <div class="pos-izq">
      <div class="pos-busca">${ico('barras')}<input id="pos-buscar" type="search" autocomplete="off" placeholder="Nome, código ou leia o código de barras" value="${esc(_qPos)}" aria-label="Buscar produto">
        <button class="pos-cam" onclick="abrirEscaner('venda')" aria-label="Ler com a câmera">${ico('camara')}</button></div>
      <div id="pos-res"></div>
    </div>
    <div class="pos-der"><div class="ticket" id="ticket"></div></div>
  </div>
  <div class="pos-barra hidden" id="pos-barra"></div>`;
  const i = $('#pos-buscar');
  i.addEventListener('input', () => { _qPos = i.value; pintarResultadosPos(); });
  i.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); enterPos(); } });
  pintarResultadosPos(); pintarTicket();
}
function buscarProdutos(q){
  q = sinTildes(q.trim()); if (!q) return [];
  const pal = q.split(/\s+/);
  return D().produtos.filter(p => { const t = sinTildes(p.nome + ' ' + p.cod + ' ' + p.grupo + ' ' + p.barras); return pal.every(w => t.includes(w)); }).slice(0, 30);
}
function pintarResultadosPos(){
  const q = _qPos.trim(), caja = $('#pos-res'); if (!caja) return;
  const tarjeta = p => { const i = info(p), sin = i.est <= 0;
    return `<button class="pos-prod ${sin ? 'agotado' : ''}" onclick="agregarAlCarro('${p.id}')">
      <span class="pp-n">${esc(p.nome)}</span>
      <span class="pp-c">${ico('pin')} ${esc(zonasDe(p).map(nomeZona).join(' + '))}</span>
      <span class="pp-pie"><b class="num">${reais(p.preco)}</b><small class="e-${i.estado}">${sin ? 'Sem estoque' : cant(i.est) + ' ' + un(p)}</small></span></button>`; };
  if (!q){
    const top = D().produtos.map(p => [p, info(p).vendMes]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 12).map(x => x[0]);
    caja.innerHTML = `<div class="pos-sub">${ico('estrella')} Os mais vendidos do mês · toque para adicionar</div><div class="pos-grilla">${top.map(tarjeta).join('')}</div>`;
    return;
  }
  const r = buscarProdutos(q);
  caja.innerHTML = r.length ? `<div class="pos-sub">${r.length} resultado${r.length > 1 ? 's' : ''} · Enter adiciona o primeiro</div><div class="pos-grilla">${r.map(tarjeta).join('')}</div>`
    : vacio(`Nenhum produto com «${esc(q)}».`);
}
function enterPos(){
  const q = _qPos.trim(); if (!q) return;
  const exacto = D().produtos.find(p => p.barras === q || p.cod === q);
  const r = exacto ? [exacto] : buscarProdutos(q);
  if (!r.length){ error('Não encontrado: «' + esc(q) + '»'); return; }
  agregarAlCarro(r[0].id);
  _qPos = ''; $('#pos-buscar').value = ''; pintarResultadosPos();
}

/* ---------- El ticket ---------- */
function agregarAlCarro(pid, c){
  const p = produto(pid); if (!p) return;
  const est = estoqueDe(p), ya = CARRO.it.find(i => i.p === pid), nueva = (ya ? ya.c : 0) + (c || 1);
  if (nueva > est){ error(est > 0 ? `Só tem ${cant(est)} ${un(p)} de ${esc(nomeCurto(p, 40))}` : `${esc(nomeCurto(p, 40))} está sem estoque`); return; }
  if (ya) ya.c = nueva; else CARRO.it.push({ p:pid, n:p.nome, c:c || 1, pr:p.preco });
  if (seccionActual === 'vendas' && EST_VENDAS.tab === 'caixa'){
    pintarTicket(); pintarResultadosPos();
    const el = $(`#tk-${pid}`); if (el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    const i = $('#pos-buscar'); if (i && window.innerWidth > 900) i.focus();
  }
}
function cambiarCant(pid, val, delta){
  const it = CARRO.it.find(i => i.p === pid); if (!it) return;
  const p = produto(pid), max = estoqueDe(p), paso = p.unid === 'kg' ? .5 : 1;
  let c = delta ? it.c + delta * paso : numero(val);
  if (!(c > 0)) c = paso;
  if (c > max){ error(`Só tem ${cant(max)} ${un(p)} em estoque`); c = max; }
  it.c = p.unid === 'kg' ? Math.round(c * 100) / 100 : Math.round(c) || 1;
  pintarTicket();
}
function quitarDelCarro(pid){ CARRO.it = CARRO.it.filter(i => i.p !== pid); pintarTicket(); }
function vaciarCarro(){ CARRO = { it:[], cli:null, desc:0 }; pintarTicket(); }
function totalesCarro(){
  const sub = r2(CARRO.it.reduce((s, i) => s + i.c * i.pr, 0));
  const desc = r2(sub * Math.min(Math.max(Number(CARRO.desc) || 0, 0), 100) / 100);
  return { sub, desc, tot:r2(sub - desc) };
}
function pintarTicket(){
  const caja = $('#ticket'); if (!caja) return;
  const t = totalesCarro(), c = cliente(CARRO.cli);
  const filas = CARRO.it.map(i => { const p = produto(i.p), q = estoqueDe(p);
    return `<div class="tk-it" id="tk-${i.p}">
      <div class="tk-n"><b>${esc(i.n)}</b><small>${reais(i.pr)} / ${un(p)} · ${ico('pin')} ${esc(zonasDe(p).map(nomeZona).join(' + '))} · fica ${cant(q - i.c)}</small></div>
      <div class="tk-cant"><button onclick="cambiarCant('${i.p}',0,-1)" aria-label="Menos">${ico('menos')}</button>
        <input value="${cant(i.c)}" inputmode="decimal" aria-label="Quantidade" onchange="cambiarCant('${i.p}',this.value)" onfocus="this.select()">
        <button onclick="cambiarCant('${i.p}',0,1)" aria-label="Mais">${ico('mas')}</button></div>
      <div class="tk-sub num">${reais(i.c * i.pr)}</div>
      <button class="tk-x" onclick="quitarDelCarro('${i.p}')" aria-label="Tirar">${ico('x')}</button></div>`; }).join('');
  caja.innerHTML = `<div class="tk-cab"><div class="tk-t">Nova venda</div>${CARRO.it.length ? `<button class="link" onclick="vaciarCarro()">Limpar</button>` : ''}</div>
    <button class="tk-cli" onclick="elegirClienteVenta()">${ico('clientes')}<span><small>Cliente</small><b>${esc(c ? c.nome : 'Consumidor final')}</b>${c ? `<small>${esc(c.tipo)} · ${esc(c.doc)}</small>` : ''}</span><span class="link">Trocar</span></button>
    <div class="tk-items">${filas || `<div class="tk-vacio"><span class="vacio-marca">${marcaRemo()}</span>Adicione produtos ao lado<br><small>ou leia o código de barras</small></div>`}</div>
    ${CARRO.it.length ? `<div class="tk-desc"><span>Desconto</span><input value="${CARRO.desc || ''}" placeholder="0" inputmode="decimal" aria-label="Desconto em %" onchange="CARRO.desc=numero(this.value);pintarTicket()"><span>%</span></div>
    <div class="tk-tot"><div><span>Subtotal</span><span class="num">${reais(t.sub)}</span></div>
      ${t.desc ? `<div><span>Desconto</span><span class="num">− ${reais(t.desc)}</span></div>` : ''}
      <div class="tk-total"><span>Total</span><span class="num">${reais(t.tot)}</span></div></div>
    <button class="btn btn-acento btn-grande tk-cobrar" onclick="faturar()">${ico('factura')} Faturar ${reais(t.tot)}</button>` : ''}`;
  const b = $('#pos-barra');
  if (b){ b.innerHTML = CARRO.it.length ? `<span>${CARRO.it.length} produto${CARRO.it.length > 1 ? 's' : ''}<b class="num">${reais(t.tot)}</b></span><button class="btn btn-acento" onclick="faturar()">Faturar</button>` : '';
    b.classList.toggle('hidden', !CARRO.it.length); }
}

/* ---------- Elegir cliente ---------- */
function elegirClienteVenta(){
  abrirModal({ titulo:'Cliente da venda', ancho:'md',
    cuerpo:`<div class="fila"><div class="buscar">${ico('buscar')}<input id="cv-q" type="search" placeholder="Nome, CNPJ ou contato" autocomplete="off"></div>
      ${puedeVer('clientes') ? `<button class="btn btn-linea" onclick="formCliente(null, true)">${ico('mas')} Cliente novo</button>` : ''}</div>
      <div class="lista mt-s" id="cv-res"></div>`,
    alAbrir: () => { const i = $('#cv-q'), pintar = () => { const q = sinTildes(i.value.trim());

  abrirModal({ titulo:'Faturar venda', sub:esc(c ? c.nome : 'Consumidor final') + ' · ' + CARRO.it.length + ' produto' + (CARRO.it.length > 1 ? 's' : ''), ancho:'modal-sm', foco:false,

}
function confirmarVenda(){
  const t = totalesCarro(), pago = ($('#fp .opcion.on') || {}).dataset.v || 'PIX';
  const num = nuevoNumero('venda'), v = { id:Store.id('v'), num, nf:12000 + num, f:hoy(), h:hora(), cli:CARRO.cli, it:[], sub:t.sub, desc:t.desc, tot:t.tot, pago, u:usuarioTxt(), est:'ok' };
  const antesEstado = {}, cambios = [];
  CARRO.it.forEach(i => {
    const p = produto(i.p); antesEstado[p.id] = info(p).estado;
    const antesZona = {}; zonasDe(p).forEach(z => antesZona[z] = estoqueZona(p, z));
    const sai = sacarEstoque(p.id, i.c, 'venda', 'Venda nº ' + num);
    v.it.push({ p:p.id, n:p.nome, c:i.c, pr:i.pr, co:p.custo, sai:sai.map(s => ({ zona:s.zona, lote:s.lote, c:s.c })) });
    const zs = []; sai.forEach(s => { if (!zs.includes(s.zona)) zs.push(s.zona); });
    zs.forEach(z => cambios.push({ p:p.id, zona:z, antes:antesZona[z] || 0, depois:estoqueZona(p, z) }));
  });
  D().vendas.unshift(v);
  D().ultimaSaida = { t:Date.now(), num, itens:cambios, visto:false };
  registrar(`Faturou a venda nº ${num} (${reais(t.tot)})`);
  guardar();
  // ¿Alguno pasó a crítico con esta venta? → aviso por e-mail
  const nuevosCriticos = CARRO.it.map(i => produto(i.p)).filter(p => ['critico', 'zerado'].includes(info(p).estado) && !['critico', 'zerado'].includes(antesEstado[p.id]));
  CARRO = { it:[], cli:null, desc:0 };
  ventaHecha(v, cambios);
  if (nuevosCriticos.length){ emailCritico(nuevosCriticos); guardar(); }
  pintarNav(); if (seccionActual === 'vendas') RENDER.vendas();
}

function produtosFiltrados(){
  const f = EST_ESTOQUE.filtro, q = sinTildes(EST_ESTOQUE.q.trim()), pal = q.split(/\s+/).filter(Boolean);
  const l = D().produtos.filter(p => { const i = info(p);
    if (EST_ESTOQUE.grupo && p.grupo !== EST_ESTOQUE.grupo) return false;
    if (f === 'repor' && i.estado === 'ok') return false;
    if (f === 'critico' && !['critico', 'zerado'].includes(i.estado)) return false;
    if (f === 'baixo' && i.estado !== 'baixo') return false;
    if (f === 'ok' && i.estado !== 'ok') return false;
    if (f === 'zerado' && i.estado !== 'zerado') return false;
    if (f === 'vence' && !(i.vencendo > 0 || i.vencidos > 0)) return false;
    if (pal.length){ const t = sinTildes(p.nome + ' ' + p.cod + ' ' + p.grupo); if (!pal.every(w => t.includes(w)) && p.barras !== q) return false; }
    return true; });
  const o = EST_ESTOQUE.orden;
  return l.sort((a, b) => o === 'nome' ? a.nome.localeCompare(b.nome)
    : o === 'cobertura' ? (info(a).cobertura == null ? 1e9 : info(a).cobertura) - (info(b).cobertura == null ? 1e9 : info(b).cobertura)

// Ventas, entradas y movimientos (ajustes y traslados) de un producto, lo más nuevo primero.
function historialProduto(p){
  const r = [];
  D().vendas.slice(0, 600).forEach(v => { if (!vendaAtiva(v)) return; v.it.forEach(i => { if (i.p === p.id) r.push({ f:v.f, h:v.h, c:-i.c, t:'Venda nº ' + v.num, det:nomeCli(v.cli) }); }); });
  D().entradas.forEach(e => e.it.forEach(i => { if (i.p === p.id) r.push({ f:e.f, h:'', c:i.c, t:'Entrada nº ' + e.num, det:nomeForn(e.forn) + ' · lote ' + i.lote + ' · ' + nomeZona(i.zona) }); }));
  D().mov.forEach(m => { if (m.p === p.id && ['ajuste', 'transferencia', 'cancelamento'].includes(m.tipo)) r.push({ f:m.f, h:m.h, c:m.c, t:MOTIVOS_MOV[m.tipo], det:(m.ref || '') + ' · ' + nomeZona(m.zona) + ' · ' + m.u }); });
  return r.sort((a, b) => (b.f + (b.h || '')).localeCompare(a.f + (a.h || '')));
}

/* ---------- Llevar parte de un lote a otra zona ---------- */
function transferirUI(pid, lid){
  const p = produto(pid), l = p.lotes.find(x => x.id === lid);
  const opts = D().zonas.filter(z => z.id !== l.zona).map(z => [z.id, z.nome + ' · ' + PISOS[z.piso].t]);
  abrirModal({ titulo:'Levar para outra zona', sub:esc(p.nome) + ' · lote ' + esc(l.lote) + ' · está em ' + esc(nomeZona(l.zona)), ancho:'modal-sm',
    cuerpo:`<div class="form">${campo('Quantidade', inp('c', cant(l.c), 'text', 'inputmode="decimal"'), { ayuda:'Tem ' + cant(l.c) + ' ' + un(p) })}${campo('Para a zona', sel('z', opts, opts[0] && opts[0][0]))}</div>`,
    pie:`<button class="btn btn-linea" onclick="fichaProduto('${pid}')">Voltar</button><button class="btn btn-prim" onclick="hacerTransferencia('${pid}', '${lid}')">${ico('transferir')} Levar</button>` });
}
function hacerTransferencia(pid, lid){
  const f = leerForm($('#modal-cuerpo')), p = produto(pid), q = numero(f.c);
  if (!transferirLote(pid, lid, q, f.z)){ error('Confira a quantidade'); return; }
  registrar(`Levou ${cant(q)} ${un(p)} de ${p.nome} para ${nomeZona(f.z)}`); guardar();
  avisar(`${cant(q)} ${un(p)} levados para ${esc(nomeZona(f.z))}`); pintarNav(); fichaProduto(pid, f.z);
}

/* ---------- Ajuste (avaria, vencido, inventário) ---------- */
function ajustarEstoque(pid){
  const p = produto(pid), lotes = lotesOrdenados(p);
  abrirModal({ titulo:'Ajustar estoque', sub:esc(p.nome), ancho:'md',
    cuerpo:`<div class="form">${campo('Motivo', sel('motivo', MOTIVOS_AJUSTE, MOTIVOS_AJUSTE[0]))}${campo('Lote', sel('lote', lotes.map(l => [l.id, l.lote + ' · ' + nomeZona(l.zona) + ' · ' + cant(l.c) + ' ' + un(p)]).concat([['novo', 'Somar como lote novo']])))}
      ${campo('Quantidade que sai (−) ou entra (+)', inp('c', '', 'text', 'inputmode="decimal" placeholder="ex.: -2"'), { ayuda:'Use o sinal de menos para tirar do estoque' })}${campo('Zona (se for lote novo)', sel('z', D().zonas.filter(z => !z.apoio).map(z => [z.id, z.nome]), p.zona))}</div>`,
    pie:`<button class="btn btn-linea" onclick="fichaProduto('${pid}')">Voltar</button><button class="btn btn-prim" onclick="guardarAjuste('${pid}')">${ico('ok')} Salvar ajuste</button>` });
}
function guardarAjuste(pid){
  const f = leerForm($('#modal-cuerpo')), p = produto(pid), c = numero(f.c);
  if (!c){ error('Escreva a quantidade'); return; }
  if (f.lote === 'novo' || c > 0){
    const l = p.lotes.find(x => x.id === f.lote);
    entrarEstoque(pid, Math.abs(c), l ? l.lote : 'AJ' + hoy().slice(2).replace(/-/g, ''), l ? l.vence : null, l ? l.zona : f.z, 'ajuste', f.motivo);
  } else {
    const l = p.lotes.find(x => x.id === f.lote); if (!l){ error('Escolha o lote'); return; }
    const q = Math.min(l.c, -c); l.c = r2(l.c - q); p.lotes = p.lotes.filter(x => x.c > 0);
    movEstoque({ p:pid, c:-q, tipo:'ajuste', ref:f.motivo, zona:l.zona, lote:l.lote });
  }
  registrar(`Ajustou o estoque de ${p.nome} (${c > 0 ? '+' : ''}${cant(c)}, ${f.motivo})`); guardar();
  avisar('Estoque ajustado'); pintarNav(); fichaProduto(pid);
}

/* ---------- Alta y edición de producto ---------- */
// zid: la zona donde se crea (desde el mapa, «Novo produto aqui»)
function formProduto(pid, barras, zid){
  const zIni = zid || (D().zonas.find(z => !z.apoio) || {}).id, zz = zona(zIni) || {}, gs = D().config.grupos;
  // el grupo sale de la zona (Confeitaria → Confeitaria; arriba, si no coincide, Embalagens)
  const gIni = gs.find(g => sinTildes(zz.nome).includes(sinTildes(g).slice(0, 6))) || (zz.piso === 'mezanino' && gs.includes('Embalagens') ? 'Embalagens' : gs[0]);
  const p = pid ? produto(pid) : { cod:String(1001 + D().produtos.length), barras:barras || '', nome:'', grupo:gIni, unid:'un', custo:'', preco:'', critico:5, baixo:10, zona:zIni, forn:D().fornecedores[0].id, validade:true };
  // Al dar de alta, se puede cargar ya el estoque inicial: así el producto aparece en el mapa con su cantidad.
  const inicial = pid ? '' : `<div class="form-sep">Estoque inicial <small class="muted">(opcional: o produto já aparece no mapa com essa quantidade)</small></div>
      ${campo('Quantidade', inp('ini_c', '', 'text', 'inputmode="decimal" placeholder="0"'))}
      ${campo('Lote', inp('ini_lote', 'L' + hoy().slice(2).replace(/-/g, '')))}
      ${campo('Validade', inp('ini_vence', sumarDias(hoy(), 90), 'date'), { ayuda:'Só se o produto tem validade' })}`;
  abrirModal({ titulo:pid ? 'Editar produto' : 'Novo produto', sub: barras ? 'Código lido: ' + esc(barras) : zid ? 'Na zona ' + esc(nomeZona(zid)) : '', ancho:'md',
    cuerpo:`<div class="form">
      ${campo('Nome', inp('nome', p.nome, 'text', 'placeholder="Ex.: Farinha de trigo tipo 1 · 5 kg"'), { ancho:true, req:true })}
      ${campo('Código interno', inp('cod', p.cod))}
      ${campo('Código de barras', `<div class="con-boton">${inp('barras', p.barras, 'text', 'inputmode="numeric"')}<button type="button" class="btn btn-linea" onclick="abrirEscaner('campo')" aria-label="Ler com a câmera">${ico('escanear')}</button></div>`)}
      ${campo('Grupo', sel('grupo', D().config.grupos, p.grupo))}
      ${campo('Unidade de venda', sel('unid', Object.keys(UNIDADES).map(k => [k, UNIDADES[k].t]), p.unid))}
      ${campo('Fornecedor', sel('forn', D().fornecedores.map(f => [f.id, f.nome]), p.forn))}
      ${campo('Lugar fixo no galpão', sel('zona', D().zonas.filter(z => !z.apoio).map(z => [z.id, z.nome + ' · ' + PISOS[z.piso].t]), p.zona))}
      ${campo('Custo (R$)', inp('custo', p.custo === '' ? '' : String(p.custo).replace('.', ','), 'text', 'inputmode="decimal"'))}
      ${campo('Preço de venda (R$)', inp('preco', p.preco === '' ? '' : String(p.preco).replace('.', ','), 'text', 'inputmode="decimal"'), { req:true })}
      <div class="form-sep">Semáforo</div>
      ${campo('Crítico: até quanto', inp('critico', p.critico, 'number'), { ayuda:'Abaixo disso, avisa por e-mail' })}
      ${campo('Baixo: até quanto', inp('baixo', p.baixo, 'number'), { ayuda:'Acima disso fica verde (OK)' })}
      ${check('validade', p.validade, 'Este produto tem validade (controla os lotes por data)')}
      ${inicial}
    </div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-prim" onclick="guardarProduto('${pid || ''}')">${ico('ok')} Salvar</button>` });
}
function guardarProduto(pid){
  const f = leerForm($('#modal-cuerpo'));
  if (!f.nome){ error('Escreva o nome do produto'); return; }
  if (f.barras && D().produtos.some(x => x.barras === f.barras && x.id !== pid)){ error('Esse código de barras já é de outro produto'); return; }
  const qIni = pid ? 0 : numero(f.ini_c);
  if (qIni > 0 && f.validade && !f.ini_vence){ error('Escreva a validade do estoque inicial'); return; }
  const datos = { nome:f.nome, cod:f.cod, barras:f.barras, grupo:f.grupo, unid:f.unid, forn:f.forn, zona:f.zona, custo:numero(f.custo), preco:numero(f.preco),
    critico:Number(f.critico) || 0, baixo:Math.max(Number(f.baixo) || 0, Number(f.critico) || 0), validade:f.validade };
  let p;
  if (pid){ p = produto(pid); Object.assign(p, datos); registrar('Editou o produto ' + p.nome); }
  else { p = Object.assign({ id:Store.id('p'), lotes:[], alta:hoy() }, datos); D().produtos.push(p); registrar('Cadastrou o produto ' + p.nome); }
  if (qIni > 0) entrarEstoque(p.id, qIni, f.ini_lote || 'S/L', f.validade ? f.ini_vence : null, p.zona, 'entrada', 'Estoque inicial');
  guardar(); cerrarModal();
  if (pid){ avisar('Produto salvo'); refrescar(); return; }
  if (qIni > 0){ avisar(`Produto cadastrado com ${cant(qIni)} ${un(p)} em ${esc(nomeZona(p.zona))}`); verNoMapa(p.id, p.zona); }
  else { avisar('Produto cadastrado. Agora é só dar entrada no estoque.'); refrescar(); fichaProduto(p.id); }
}

function buscarEntradas(q){ EST_ENTR.q = q; EST_ENTR.ver = 60; RENDER.entradas(); const i = $('#en-q'); i.focus(); i.setSelectionRange(q.length, q.length); }

// Atajo: lo que hay que reponer de ese proveedor
function pintarSugEntrada(){
  const c = $('#en-sug'); if (!c) return;
  const l = D().produtos.filter(p => p.forn === ENTRADA.forn && precisaRepor(p));
  c.innerHTML = l.length ? `<div class="caja-info aviso-am mt-s">${ico('reposicao')}<span>${l.length} produto${l.length > 1 ? 's' : ''} deste fornecedor ${l.length > 1 ? 'estão' : 'está'} para repor. <button class="link" onclick="sugEntrada()">Adicionar com a quantidade sugerida</button></span></div>` : '';
}
function sugEntrada(){ D().produtos.filter(p => p.forn === ENTRADA.forn && precisaRepor(p)).forEach(p => agregarEntrada(p.id, info(p).sugestao || p.baixo)); }
function agregarEntrada(pid, c){
  const p = produto(pid); if (!p) return;
  if (ENTRADA.it.some(i => i.p === pid)){ avisar('Esse produto já está na lista', 'info'); return; }
  const f = ENTRADA.f || hoy();
  ENTRADA.it.push({ p:pid, c:c || '', custo:p.custo, lote:'L' + f.slice(2).replace(/-/g, ''), vence: p.validade ? sumarDias(f, 120) : '', zona: ENTRADA.zona || p.zona });
  if (p.forn !== ENTRADA.forn && ENTRADA.it.length === 1){ ENTRADA.forn = p.forn; const s = $('#modal-cuerpo [name=forn]'); if (s) s.value = p.forn; pintarSugEntrada(); }
  pintarFilasEntrada();
}
function pintarFilasEntrada(){
  const c = $('#en-filas'); if (!c) return;
  const zs = D().zonas.filter(z => !z.apoio || z.id === 'zRec').map(z => [z.id, z.nome]);
  if (!ENTRADA.it.length){ c.innerHTML = vacio('Busque os produtos que chegaram, leia o código de barras ou use a sugestão acima.'); return; }

  c.innerHTML = `<div class="tabla-scroll"><table class="tabla tabla-en"><thead><tr><th>Produto</th><th>Qtd.</th>${veCusto() ? '<th>Custo</th>' : ''}<th>Lote</th><th>Validade</th><th>Zona</th><th></th></tr></thead><tbody>

        <td><input class="mini izq" value="${esc(i.lote)}" onchange="ENTRADA.it[${k}].lote=this.value"></td>
        <td>${p.validade ? `<input class="mini fecha" type="date" value="${esc(i.vence)}" onchange="ENTRADA.it[${k}].vence=this.value">` : '<span class="muted">Não vence</span>'}</td>
        <td><select class="sel sel-mini" onchange="ENTRADA.it[${k}].zona=this.value">${zs.map(([v, t]) => `<option value="${v}" ${v === i.zona ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></td>
        <td><button class="tk-x" onclick="ENTRADA.it.splice(${k},1); pintarFilasEntrada()" aria-label="Tirar">${ico('x')}</button></td></tr>`; }).join('')}
  </tbody>${veCusto() ? `<tfoot><tr><td colspan="2">Total da nota</td><td colspan="5" class="num">${reais(tot)}</td></tr></tfoot>` : ''}</table></div>`;

function guardarEntrada(){
  const it = ENTRADA.it.filter(i => numero(i.c) > 0);
  if (!it.length){ error('Escreva a quantidade de pelo menos um produto'); return; }
  const falta = it.find(i => produto(i.p).validade && !i.vence);
  if (falta){ error('Falta a validade de ' + esc(nomeCurto(produto(falta.p), 40))); return; }
  const num = nuevoNumero('entrada');
  const e = { id:Store.id('en'), num, f:ENTRADA.f || hoy(), forn:ENTRADA.forn, nf:ENTRADA.nf, u:usuarioTxt(), obs:'',
    it: it.map(i => ({ p:i.p, c:numero(i.c), custo:Number(i.custo) || produto(i.p).custo, lote:i.lote || 'S/L', vence:produto(i.p).validade ? i.vence : null, zona:i.zona })) };
  e.tot = r2(e.it.reduce((s, i) => s + i.c * i.custo, 0));
  e.it.forEach(i => { entrarEstoque(i.p, i.c, i.lote, i.vence, i.zona, 'entrada', 'Entrada nº ' + num); produto(i.p).custo = i.custo; });
  D().entradas.unshift(e);
  registrar(`Deu entrada nº ${num} de ${nomeForn(e.forn)} (${e.it.length} produtos)`);
  guardar(); ENTRADA = null;
  const zs = []; e.it.forEach(i => { if (!zs.includes(i.zona)) zs.push(i.zona); });
  abrirModal({ titulo:'Entrada registrada', ancho:'modal-sm', foco:false,
    cuerpo:`<div class="hecha">${ico('ok')}<b class="num">${e.it.length} produto${e.it.length > 1 ? 's' : ''}</b><span>Entrada nº ${num} · ${esc(nomeForn(e.forn))}</span></div>
      <div class="sub-t mt">Guardados em</div><div class="chips-lista">${zs.map(z => `<button class="chip sin-punto zona-tag" style="--zc:${(zona(z) || {}).cor}" onclick="cerrarModal(); irAZona('${z}')">${esc(nomeZona(z))}</button>`).join('')}</div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Fechar</button><button class="btn btn-prim" onclick="cerrarModal(); irAZona('${zs[0]}')">${ico('mapa')} Ver no mapa</button>` });
  pintarNav(); if (['entradas', 'mapa', 'estoque', 'reposicao', 'inicio'].includes(seccionActual)) RENDER[seccionActual]();
}

/* ===== js/14-estatisticas.js ===== */
/* =====================================================================
   ESTATÍSTICAS DO ESTOQUE
   Lo que una técnica en logística mira: ventas y compras por mes, los
   más vendidos, la curva ABC, el giro y los días de estoque, el valor
   por zona y lo que está parado.
   ===================================================================== */
const EST_STATS = { dias:90 };

RENDER.estatisticas = function(){
  const h = hoy(), dias = EST_STATS.dias, desde = sumarDias(h, -dias + 1);
  encabezado('Estatísticas', 'Como o estoque está girando. Os números saem sozinhos das vendas e das entradas.',
    `<div class="segmento">${[30, 90, 150].map(n => `<button class="${n === dias ? 'on' : ''}" onclick="EST_STATS.dias=${n}; RENDER.estatisticas()">${n} dias</button>`).join('')}</div>`);

  // Totales del período
  const vend = D().vendas.filter(v => vendaAtiva(v) && v.f >= desde);
  const receita = vend.reduce((s, v) => s + v.tot, 0);
  const custoV = vend.reduce((s, v) => s + v.it.reduce((a, i) => a + i.c * i.co, 0), 0);
  const valor = valorEstoque(), custoDia = custoV / dias;
  const giro = valor ? (custoV / dias * 365) / valor : 0, cobertura = custoDia ? Math.round(valor / custoDia) : 0;

  // Por producto en el período (para el ranking y la curva ABC)
  const porProd = {};
  vend.forEach(v => { const f = v.sub > 0 ? v.tot / v.sub : 1; v.it.forEach(i => { const x = porProd[i.p] || (porProd[i.p] = { q:0, r:0 }); x.q += i.c; x.r += i.c * i.pr * f; }); });
  const ranking = Object.keys(porProd).map(pid => ({ p:produto(pid), ...porProd[pid] })).filter(x => x.p).sort((a, b) => b.r - a.r);
  let acum = 0; ranking.forEach(x => { acum += x.r; x.cls = acum / receita <= .8 ? 'A' : acum / receita <= .95 ? 'B' : 'C'; });
  const abc = { A:[], B:[], C:[] }; ranking.forEach(x => abc[x.cls].push(x));
  const sinVenta = D().produtos.filter(p => !porProd[p.id]);

  // Ventas y compras por mes (los últimos 5 meses)
  const meses = []; for (let k = 4; k >= 0; k--) meses.push(mesClave(sumarMeses(h, -k)));
  const vm = meses.map(m => D().vendas.filter(v => vendaAtiva(v) && mesClave(v.f) === m).reduce((s, v) => s + v.tot, 0));
  const cm = meses.map(m => D().entradas.filter(e => mesClave(e.f) === m).reduce((s, e) => s + e.tot, 0));
  const maxM = Math.max(...vm, ...cm, 1);
  const grafMeses = `<div class="gm">${meses.map((m, i) => `<div class="gm-col"><div class="gm-barras">
      <i class="gm-v" style="height:${vm[i] / maxM * 100}%" title="Vendas ${fMes(m)}: ${reais0(vm[i])}"><span>${reaisK(vm[i])}</span></i>
      <i class="gm-c" style="height:${cm[i] / maxM * 100}%" title="Entradas ${fMes(m)}: ${reais0(cm[i])}"></i></div>
      <small>${MESES_C[Number(m.slice(5)) - 1]}${i === 4 ? ' (até hoje)' : ''}</small></div>`).join('')}</div>
    <div class="leyenda mt-s"><span><i class="lv"></i>Vendas</span><span><i class="lg"></i>Entradas (compras a custo)</span></div>`;

  const top = ranking.slice(0, 10), maxT = Math.max(...top.map(x => x.r), 1);
  const grafTop = top.map((x, i) => `<button class="hb" onclick="fichaProduto('${x.p.id}')"><span class="hb-n"><b>${i + 1}.</b> ${esc(nomeCurto(x.p, 46))}</span>
    <span class="hb-b"><i style="width:${x.r / maxT * 100}%"></i></span><span class="hb-v num">${reaisK(x.r)}</span></button>`).join('');

  // Valor por zona
  const zs = D().zonas.filter(z => !z.apoio).map(z => ({ z, v:resumoZona(z.id).valor })).sort((a, b) => b.v - a.v), maxZ = Math.max(...zs.map(x => x.v), 1);
  const grafZonas = zs.map(x => `<button class="hb" onclick="irAZona('${x.z.id}')"><span class="hb-n">${esc(x.z.nome)}<small> · ${PISOS[x.z.piso].t}</small></span>
    <span class="hb-b"><i style="width:${x.v / maxZ * 100}%; background:${x.z.cor}"></i></span><span class="hb-v num">${reaisK(x.v)}</span></button>`).join('');

  // Semáforo por grupo
  const grafGrupos = D().config.grupos.map(g => { const ps = D().produtos.filter(p => p.grupo === g), n = ps.length || 1;

const EST_REP = { tab:'pedir', sug:{} };

RENDER.reposicao = function(){
  const t = EST_REP.tab, n = D().produtos.filter(precisaRepor).length;
  encabezado('Reposição e avisos', t === 'pedir' ? `A quantidade sugerida dá para ${D().config.coberturaAlvo} dias de venda, no ritmo dos últimos ${D().config.diasAnalise} dias.` : 'O sistema avisa por e-mail quando é hora de pedir mais.',
    t === 'avisos' ? `<button class="btn btn-linea" onclick="enviarResumoAgora()">${ico('enviar')} Enviar um resumo agora</button>` : '');
  $('#vista').innerHTML = pestanas([['pedir', 'Para pedir', n, true], ['avisos', 'Avisos por e-mail', D().emails.filter(e => e.f === hoy()).length]], t, 'tabRep') + '<div id="rep-cuerpo"></div>';
  if (t === 'pedir') pintarPedir(); else pintarAvisosMail();
};
function tabRep(t){ EST_REP.tab = t; RENDER.reposicao(); }
const sugDe = p => EST_REP.sug[p.id] != null ? EST_REP.sug[p.id] : info(p).sugestao;

function pintarPedir(){
  const lista = D().produtos.filter(precisaRepor);
  if (!lista.length){ $('#rep-cuerpo').innerHTML = vacio('Nada para repor agora. 👏'); return; }
  const porForn = {}; lista.forEach(p => (porForn[p.forn] = porForn[p.forn] || []).push(p));
  const forns = Object.keys(porForn).sort((a, b) => porForn[b].filter(p => info(p).estado !== 'baixo').length - porForn[a].filter(p => info(p).estado !== 'baixo').length);
  $('#rep-cuerpo').innerHTML = `<div class="rep-ley">${chipEstado('zerado')} ${chipEstado('critico')} pedir já · ${chipEstado('baixo')} programar o próximo pedido</div>` + forns.map(fid => {
    const f = fornecedor(fid), ps = porForn[fid].sort((a, b) => ORDEN_ESTADO[info(a).estado] - ORDEN_ESTADO[info(b).estado]);
    const tot = ps.reduce((s, p) => s + sugDe(p) * p.custo, 0);
    return `<div class="card rep-card mt"><div class="card-cab"><div class="card-t">${esc(f.nome)}<small>${esc(f.contato)} · ${esc(f.tel)} · entrega em ${f.prazo} dias</small></div>
        <div class="fila"><button class="btn btn-linea btn-sm" onclick="verPedido('${fid}')">${ico('factura')} Ver o pedido</button><button class="btn btn-suave btn-sm" onclick="entradaDesdePedido('${fid}')">${ico('entrada')} Chegou: dar entrada</button></div></div>
      <div class="tabla-scroll"><table class="tabla"><thead><tr><th>Produto</th><th class="derecha">Tem</th><th>Semáforo</th><th class="derecha">Vende por dia</th><th class="derecha">Dura</th><th class="derecha">Pedir</th>${veCusto() ? '<th class="derecha">Custo</th>' : ''}</tr></thead><tbody>
      ${ps.map(p => { const i = info(p), dura = i.cobertura == null ? '—' : i.cobertura + ' dias';
        return `<tr><td><button class="link" onclick="fichaProduto('${p.id}')">${esc(p.nome)}</button><span class="p-cod">${esc(zonasDe(p).map(nomeZona).join(' + '))}</span></td><td class="derecha num"><b>${cant(i.est)}</b> ${un(p)}</td><td>${chipEstado(i.estado)}</td>
          <td class="derecha num">${cant(Math.round(i.mediaDia * 10) / 10)}</td><td class="derecha num ${i.cobertura != null && i.cobertura < f.prazo ? 'neg fuerte' : ''}">${dura}</td>
          <td class="derecha"><input class="mini" inputmode="decimal" value="${sugDe(p)}" onchange="EST_REP.sug['${p.id}']=numero(this.value); pintarPedir()" aria-label="Quantidade a pedir"> ${un(p)}</td>
          ${veCusto() ? `<td class="derecha num">${reais(sugDe(p) * p.custo)}</td>` : ''}</tr>`; }).join('')}
      </tbody>${veCusto() ? `<tfoot><tr><td colspan="6">Total do pedido</td><td class="derecha num">${reais(tot)}</td></tr></tfoot>` : ''}</table></div>
      ${ps.some(p => info(p).cobertura != null && info(p).cobertura < f.prazo) ? `<div class="caja-info alerta mt-s">${ico('alerta')}<span>Em vermelho: acaba antes de o fornecedor conseguir entregar (${f.prazo} dias). Peça hoje.</span></div>` : ''}</div>`;
  }).join('');
}
function textoPedido(fid){
  const f = fornecedor(fid), ps = D().produtos.filter(p => p.forn === fid && precisaRepor(p) && sugDe(p) > 0);
  return `Olá, ${f.contato}! Aqui é da ${NEGOCIO.razon}.\nGostaríamos de fazer o seguinte pedido:\n\n` + ps.map(p => `• ${cant(sugDe(p))} ${un(p)} — ${p.nome} (cód. ${p.cod})`).join('\n') + `\n\nPor favor, confirme o prazo de entrega. Obrigado!`;
}
function verPedido(fid){
  const f = fornecedor(fid), txt = textoPedido(fid);
  abrirModal({ titulo:'Pedido para ' + esc(f.nome), sub:esc(f.email) + ' · ' + esc(f.tel), ancho:'md', foco:false,
    cuerpo:`<pre class="pedido-txt">${esc(txt)}</pre><p class="muted chico mt-s">Na versão final, o pedido sai direto por e-mail ou WhatsApp para o fornecedor.</p>`,
    pie:`<button class="btn btn-linea" onclick="imprimirPedido('${fid}')">${ico('imprimir')} Imprimir</button><button class="btn btn-prim" onclick="copiarPedido('${fid}')">${ico('lista')} Copiar o texto</button>` });
}
function copiarPedido(fid){
  const t = textoPedido(fid);
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => avisar('Pedido copiado: é só colar no e-mail ou no WhatsApp'), () => error('Não deu para copiar. Selecione o texto e copie.'));
}
function imprimirPedido(fid){
  const f = fornecedor(fid), ps = D().produtos.filter(p => p.forn === fid && precisaRepor(p) && sugDe(p) > 0);
  $('#impresion').innerHTML = `<div class="imp"><div class="imp-cab"><div class="imp-logo">${logoRemo()}</div><div class="imp-neg"><b>Pedido de compra</b><span>${esc(NEGOCIO.razon)}</span></div><div class="imp-doc"><b>${fCorta(hoy())}</b><span>para ${esc(f.nome)}</span></div></div>
    <table class="imp-t"><thead><tr><th>Cód.</th><th>Produto</th><th class="d">Quantidade</th></tr></thead><tbody>${ps.map(p => `<tr><td>${p.cod}</td><td>${esc(p.nome)}</td><td class="d">${cant(sugDe(p))} ${un(p)}</td></tr>`).join('')}</tbody></table>
    <div class="imp-pie">Gerado pelo sistema de estoque da Remo · Wydan Solutions</div></div>`;
  window.print();
}
function entradaDesdePedido(fid){
  const ps = D().produtos.filter(p => p.forn === fid && precisaRepor(p) && sugDe(p) > 0);
  nuevaEntrada('', fid, []);
  ps.forEach(p => agregarEntrada(p.id, sugDe(p)));

const EST_CLI = { filtro:'todos', q:'', ver:60 };

RENDER.clientes = function(){

function filtroCli(f){ EST_CLI.filtro = f; EST_CLI.ver = 60; RENDER.clientes(); }
function buscarCli(q){ EST_CLI.q = q; EST_CLI.ver = 60; RENDER.clientes(); const i = $('#cl-q'); i.focus(); i.setSelectionRange(q.length, q.length); }
function exportarClientes(){

function fichaCliente(id){
  const c = cliente(id); if (!c) return;
  const vs = D().vendas.filter(v => v.cli === id && vendaAtiva(v));
  const prods = {}; vs.forEach(v => v.it.forEach(i => { prods[i.p] = (prods[i.p] || 0) + i.c * i.pr; }));
  const top = Object.keys(prods).sort((a, b) => prods[b] - prods[a]).slice(0, 6);
  const tot = vs.reduce((s, v) => s + v.tot, 0);
  abrirModal({ titulo:esc(c.nome), sub:esc(c.tipo) + ' · cliente desde ' + fCorta(c.alta) + (novoCliente(c) ? ' · <span class="chip c-azul sin-punto">Novo</span>' : ''), ancho:'lg', foco:false,
    cuerpo:`<div class="datos"><div><small>CNPJ / CPF</small><b>${esc(c.doc)}</b></div><div><small>Contato</small><b>${esc(c.contato)}</b></div><div><small>Telefone</small><b>${esc(c.tel)}</b></div>

/* ===== js/19-escaner.js ===== */
/* =====================================================================
   LECTOR DE CÓDIGO DE BARRAS / QR CON LA CÁMARA (punto 9)
   - En el celular usa la cámara de atrás. En la computadora, la webcam
     (o un lector USB, que escribe solo en cualquier buscador).
   - La librería (html5-qrcode) se baja recién cuando se abre el lector.
   - Para mostrar la demo sin cámara: «Simular leitura».
   Modos: buscar · venda · entrada · novo (cadastrar) · campo (llenar el
   código en la ficha del producto).
   ===================================================================== */
const LIB_ESCANER = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
let _modoEsc = 'buscar', _lector = null, _libEsc = null;

function cargarLibEscaner(){
  if (window.Html5Qrcode) return Promise.resolve();
  if (_libEsc) return _libEsc;
  _libEsc = new Promise((ok, mal) => { const s = document.createElement('script'); s.src = LIB_ESCANER; s.onload = ok; s.onerror = () => { _libEsc = null; mal(); }; document.head.appendChild(s); });
  return _libEsc;
}
function abrirEscaner(modo){
  _modoEsc = modo || 'buscar';
  const t = { buscar:['Ler código', 'Mostra onde está o produto'], venda:['Ler código', 'Adiciona o produto à venda'], entrada:['Ler código', 'Adiciona o produto à entrada'],
    novo:['Cadastrar produto', 'Leia o código do produto novo'], campo:['Ler código', 'Preenche o código de barras'] }[_modoEsc];
  $('#esc-titulo').textContent = t[0]; $('#esc-sub').textContent = t[1];
  $('#esc-codigo').value = '';
  $('#esc-simular').innerHTML = `${ico('escanear')} Sem câmera? Simular uma leitura${_modoEsc === 'novo' || _modoEsc === 'campo' ? ' (produto novo)' : ''}`;
  $('#escaner').classList.remove('hidden');
  $('#esc-estado').innerHTML = `<span>${ico('camara')} Abrindo a câmera…</span>`;
  $('#esc-visor').classList.remove('sin-cam');
  cargarLibEscaner().then(() => {
    if ($('#escaner').classList.contains('hidden')) return;
    _lector = new Html5Qrcode('esc-camara', { verbose:false });
    return _lector.start({ facingMode:'environment' }, { fps:10, qrbox:(w, h) => ({ width:Math.round(w * .8), height:Math.round(Math.min(h * .55, w * .5)) }) },
      txt => procesarCodigo(txt), () => {}).then(() => { $('#esc-estado').innerHTML = ''; });
  }).catch(() => {
    $('#esc-visor').classList.add('sin-cam');
    $('#esc-estado').innerHTML = `<span>${ico('camara')} A câmera não está disponível aqui.<br><small>Digite o código ou use «Simular uma leitura».</small></span>`;
    _lector = null;
  });
}
function cerrarEscaner(){
  $('#escaner').classList.add('hidden');
  const l = _lector; _lector = null;
  if (l){ try { l.stop().then(() => l.clear()).catch(() => {}); } catch (e) { /* ya estaba parado */ } }
}
function leerCodigoManual(){ const v = $('#esc-codigo').value.trim(); if (v) procesarCodigo(v); }
function simularLectura(){
  if (_modoEsc === 'novo' || _modoEsc === 'campo'){ procesarCodigo(ean13('7891' + String(Math.floor(1e7 + Math.random() * 9e7)))); return; }
  // en la venta, el ejemplo de la clienta: la harina de 5 kg
  const conEst = D().produtos.filter(p => estoqueDe(p) > 0);
  const p = _modoEsc === 'venda' && Math.random() < .6 ? D().produtos[0] : conEst[Math.floor(Math.random() * conEst.length)];
  procesarCodigo(p.barras);
}
function procesarCodigo(cod){
  cod = String(cod).trim();
  cerrarEscaner();
  if (navigator.vibrate) navigator.vibrate(60);
  const p = D().produtos.find(x => x.barras === cod || x.cod === cod);
  if (_modoEsc === 'campo'){ const i = $('#modal-cuerpo [name=barras]'); if (i) i.value = cod; avisar('Código lido: ' + esc(cod), 'barras'); return; }
  if (_modoEsc === 'venda'){
    if (!p){ error('Código ' + esc(cod) + ' não cadastrado'); return; }
    if (seccionActual !== 'vendas') nuevaVenta();
    agregarAlCarro(p.id); avisar(esc(nomeCurto(p, 40)) + ' adicionado à venda', 'barras'); return;
  }
  if (_modoEsc === 'entrada'){
    if (!p){ error('Código ' + esc(cod) + ' não cadastrado. Cadastre o produto primeiro.'); return; }
    agregarEntrada(p.id); return;
  }
  if (p){ fichaProduto(p.id); return; }
  // Código que no existe: ofrecer cadastrarlo (lo que pidió: «escáner para novos produtos»)
  if (esGerente() || rolActual() === 'deposito') formProduto(null, cod);
  else error('Código ' + esc(cod) + ' não cadastrado');
}


/* ===== js/20-celular.js ===== */
/*
 * Adaptación al celular (estándar de Wydan, copiado de María Lucía y ajustado a esta página).
 * Mira cada tabla, la marca según cuántas columnas tiene y le copia a cada celda el título de su
 * columna. Con eso, en pantalla chica, cada fila se muestra como una ficha (etiqueta a la izquierda,
 * dato a la derecha) en lugar de obligar a deslizar de costado. Lo hace solo, cada vez que una
 * sección o una ventana se vuelve a dibujar: no hay que tocar nada al agregar una sección.
 *   t-mini  → pocas columnas: entra entera en el celular.
 *   t-ficha → una lista de registros: cada fila pasa a ser una ficha.
 *   t-ancha → muchas columnas: se desliza de costado, con la primera columna siempre a la vista.
 */
(function(){
  function marcarTabla(t){
    if (['t-mini', 't-ficha', 't-ancha'].some(c => t.classList.contains(c))) return;   // la sección ya la marcó a mano
    const columnas = t.querySelectorAll('thead tr:last-child th').length;
    t.classList.add(columnas <= 3 ? 't-mini' : columnas <= 11 ? 't-ficha' : 't-ancha');
  }
  function etiquetarFilas(t){
    const titulos = Array.from(t.querySelectorAll('thead tr:last-child th')).map(x => (x.textContent || '').trim());
    t.querySelectorAll('tbody tr, tfoot tr').forEach(tr => {
      if (tr._etiquetada) return; tr._etiquetada = true;
      Array.from(tr.children).forEach((td, i) => { if (td.colSpan > 1) return; if (titulos[i]) td.setAttribute('data-l', titulos[i]); });
    });
  }
  function revisar(){
    document.querySelectorAll('main table, #modal table').forEach(t => { if (!t.tHead) return; if (!t._marcada){ t._marcada = true; marcarTabla(t); } etiquetarFilas(t); });
  }
  let pendiente = false;
  const agendar = () => { if (pendiente) return; pendiente = true; setTimeout(() => { pendiente = false; revisar(); }, 0); };
  function arrancar(){
    revisar();
    if (window.MutationObserver){
      [document.querySelector('main'), document.querySelector('#modal')].forEach(el => { if (el) new MutationObserver(agendar).observe(el, { childList:true, subtree:true }); });
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar); else arrancar();
})();
