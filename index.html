/* =====================================================================
   HERRAMIENTAS COMUNES: fechas, formatos, ventanas, avisos, exportar
   (los textos que ve la persona, en portugués de Brasil)
   ===================================================================== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2 = n => String(n).padStart(2, '0');
const sinTildes = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const r2 = n => Math.round(n * 100) / 100;

/* ---------- Fechas (siempre como texto 'AAAA-MM-DD') ---------- */
const DIAS  = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const DIAS_C = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESES_C = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function iso(d){ return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function aFecha(s){ const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function hoy(){ return iso(new Date()); }
function hora(){ const d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function sumarDias(s, n){ const d = aFecha(s); d.setDate(d.getDate() + n); return iso(d); }
function sumarMeses(s, n){ const d = aFecha(s); d.setDate(1); d.setMonth(d.getMonth() + n); return iso(d); }
function difDias(a, b){ return Math.round((aFecha(b) - aFecha(a)) / 864e5); }   // b − a
function diaSemana(s){ return aFecha(s).getDay(); }
function inicioMes(s){ return s.slice(0, 8) + '01'; }
function mesClave(s){ return s.slice(0, 7); }
function fLarga(s){ const d = aFecha(s); return DIAS[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
function fCorta(s){ if (!s) return '—'; const d = aFecha(s); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear(); }
function fMedia(s){ if (!s) return '—'; const d = aFecha(s); return d.getDate() + ' ' + MESES_C[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); }
function fMes(s){ const d = aFecha(s.length === 7 ? s + '-01' : s); return MESES[d.getMonth()] + ' ' + d.getFullYear(); }
function fMesC(s){ const d = aFecha(s.length === 7 ? s + '-01' : s); return MESES_C[d.getMonth()] + '/' + String(d.getFullYear()).slice(2); }
function cuando(s){
  const n = difDias(hoy(), s);
  if (n === 0) return 'hoje'; if (n === 1) return 'amanhã'; if (n === -1) return 'ontem';
  return n > 0 ? 'em ' + n + ' dias' : 'há ' + (-n) + ' dias';
}

/* ---------- Números y dinero (reales) ---------- */
const fmtNum = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
const fmtDec = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
const fmt2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function reais(n){ n = r2(n || 0); return (n < 0 ? '− ' : '') + 'R$ ' + fmt2.format(Math.abs(n)); }        // con centavos
function reais0(n){ return (n < 0 ? '− ' : '') + 'R$ ' + fmtNum.format(Math.abs(Math.round(n || 0))); }    // redondo (indicadores)
function reaisK(n){ const a = Math.abs(n || 0); return a >= 1e6 ? 'R$ ' + fmtDec.format(Math.round(a / 1e5) / 10) + ' mi' : a >= 1e4 ? 'R$ ' + fmtNum.format(Math.round(a / 1e3)) + ' mil' : reais0(n); }
function pct(n){ return fmtDec.format(Math.round(n * 10) / 10) + '%'; }
function cant(n){ return fmtDec.format(Math.round((n || 0) * 100) / 100); }
function numero(v){ return Number(String(v == null ? '' : v).replace(/\./g, '').replace(',', '.')) || 0; }   // lo que se escribe con coma decimal

function iniciales(n){ return String(n || '?').split(' ').filter(w => w.length > 2).slice(0, 2).map(p => p[0]).join('').toUpperCase() || '?'; }
function telLimpio(t){ let d = String(t || '').replace(/\D/g, ''); if (d.startsWith('55')) return d; return '55' + d; }

// Pregunta de confirmación. Devuelve una promesa (true = aceptó).
function confirmar(titulo, texto, si, peligro){
  return new Promise(res => {
    $('#dlg-titulo').textContent = titulo; $('#dlg-texto').innerHTML = texto || '';
    const bSi = $('#dlg-si'), bNo = $('#dlg-no');
    bSi.textContent = si || 'Aceitar';
    bSi.className = 'btn ' + (peligro ? 'btn-peligro' : 'btn-prim');
    $('#dialogo').classList.remove('hidden');
    setTimeout(() => bSi.focus(), 50);
    const fin = v => { $('#dialogo').classList.add('hidden'); bSi.onclick = bNo.onclick = null; res(v); };
    bSi.onclick = () => fin(true); bNo.onclick = () => fin(false);
  });
}

  });
}

/* ---------- Formularios ---------- */
function campo(etq, control, extra){ extra = extra || {}; return `<div class="campo ${extra.ancho ? 'ancho' : ''} ${extra.req ? 'req' : ''} ${extra.cls || ''}">${etq ? `<label>${etq}</label>` : ''}${control}${extra.ayuda ? `<div class="ayuda">${extra.ayuda}</div>` : ''}</div>`; }
function inp(nombre, valor, tipo, extra){ return `<input name="${nombre}" type="${tipo || 'text'}" value="${esc(valor == null ? '' : valor)}" ${tipo === 'number' ? 'inputmode="decimal" step="any"' : ''} ${extra || ''}>`; }
function area(nombre, valor, extra){ return `<textarea name="${nombre}" ${extra || ''}>${esc(valor || '')}</textarea>`; }
function sel(nombre, opciones, valor, extra){   // opciones: ['a','b'] o [[valor, texto], ...]
  return `<select name="${nombre}" ${extra || ''}>` + opciones.map(o => {
    const v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o;
    return `<option value="${esc(v)}" ${String(v) === String(valor) ? 'selected' : ''}>${esc(t)}</option>`;
  }).join('') + '</select>';
}
function check(nombre, marcado, texto, extra){ return `<div class="campo check"><label><input type="checkbox" name="${nombre}" ${marcado ? 'checked' : ''} ${extra || ''}> ${texto}</label></div>`; }
function leerForm(raiz){
  const o = {};
  $$('[name]', raiz).forEach(el => {
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'radio'){ if (el.checked) o[el.name] = el.value; }
    else if (el.type === 'number') o[el.name] = el.value === '' ? '' : Number(el.value);
    else o[el.name] = el.value.trim();
  });
  return o;
}
function pildoras(lista, actual, fn){   // lista: [[valor, texto, n, clase], ...]
  return `<div class="pildoras">` + lista.map(([v, t, n, c]) =>
    `<button class="pildora ${c || ''} ${String(v) === String(actual) ? 'on' : ''}" onclick="${fn}('${v}')">${t}${n != null ? ` <span class="n">${n}</span>` : ''}</button>`).join('') + '</div>';
}
function pestanas(lista, actual, fn){    // lista: [[valor, texto, n, alerta], ...]
  return `<div class="pestanas" role="tablist">` + lista.map(([v, t, n, al]) =>
    `<button class="pestana ${v === actual ? 'on' : ''}" role="tab" aria-selected="${v === actual}" onclick="${fn}('${v}')">${t}${n ? ` <span class="n ${al ? 'alerta' : ''}">${n}</span>` : ''}</button>`).join('') + '</div>';
}
function kpi(etq, valor, detalle, o){ o = o || {};
  const tag = o.click ? 'button' : 'div';
  return `<${tag} class="kpi ${o.cls || ''}" ${o.click ? `onclick="${o.click}"` : ''}><div class="kpi-l">${o.ico ? ico(o.ico) : ''}${etq}</div><div class="kpi-v num">${valor}</div>${detalle ? `<div class="kpi-d">${detalle}</div>` : ''}</${tag}>`;
}
function buscador(id, valor, ph, fn){
  return `<div class="buscar">${ico('buscar')}<input id="${id}" type="search" value="${esc(valor || '')}" placeholder="${ph}" oninput="${fn}(this.value)" autocomplete="off"></div>`;
}
// Tablas largas: se muestran de a 60 filas con «Ver mais»
function paginar(lista, estado, fnMas){
  const n = estado.ver || 60;
  return { filas: lista.slice(0, n), mas: lista.length > n ? `<div class="mas-filas"><button class="btn btn-linea btn-sm" onclick="${fnMas}">Ver mais (${lista.length - n} restantes)</button></div>` : '' };
}

/* ---------- Exportar a Excel (CSV que Excel abre directo) ---------- */
function exportarCSV(nombre, cab, filas){
  const cel = v => { v = v == null ? '' : String(v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const txt = '﻿' + [cab].concat(filas).map(f => f.map(cel).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type:'text/csv;charset=utf-8' }));
  a.download = NEGOCIO.nombre + ' - ' + nombre + ' - ' + hoy() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  avisar('Baixou «' + nombre + '» (abre no Excel)', 'descargar');
}
const numCSV = n => String(Math.round((n || 0) * 100) / 100).replace('.', ',');

// Generador de números "al azar" pero siempre iguales (para los datos de ejemplo)
function azar(semilla){ let a = semilla >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- «Mais opções»: lo que se usa poco queda guardado acá, a un toque ---------- */
function menuMas(items){   // items: [[ícono, texto, acción], ...]
  items = items.filter(Boolean); if (!items.length) return '';
  return `<div class="mas-caja"><button class="btn btn-linea" onclick="alternarMas(this)" aria-haspopup="true">${ico('menu')} Mais opções</button>
    <div class="mas-menu hidden">${items.map(([i, t, f]) => `<button onclick="cerrarMas(); ${f}">${ico(i)} ${t}</button>`).join('')}</div></div>`;
}
function alternarMas(b){ const m = b.nextElementSibling, abierto = !m.classList.contains('hidden'); cerrarMas(); if (!abierto) m.classList.remove('hidden'); }
function cerrarMas(){ $$('.mas-menu').forEach(m => m.classList.add('hidden')); }
document.addEventListener('click', e => { if (!e.target.closest('.mas-caja')) cerrarMas(); });

/* ---------- Números que cuentan (de un valor a otro, despacito) ---------- */
function contar(el, desde, hasta, ms){
  if (!el) return;
  const t0 = performance.now(), dur = ms || 1100;
  const paso = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = cant(Math.round(desde + (hasta - desde) * e)); if (k < 1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso);
}


/* ===== js/03-datos.js ===== */
/* =====================================================================
   CAPA DE DATOS
   En esta demostración todo se guarda en el navegador (localStorage).
   En la versión real, cada registro se guarda como un documento en
   Firestore (Firebase): solo cambia este archivo, el resto no se toca.
   ===================================================================== */
let _cache = {};
function memo(k, fn){ return k in _cache ? _cache[k] : (_cache[k] = fn()); }

const Store = {
  data: null,
  cargar(){
    let d = null;
    try { d = JSON.parse(localStorage.getItem(CLAVE_GUARDADO) || 'null'); } catch (e) { d = null; }
    // El demo SIEMPRE tiene ejemplos: si la copia está vacía, rota o es de otra versión, se vuelve a sembrar.
    if (!d || d.version !== 1 || !Array.isArray(d.vendas) || !d.vendas.length || !Array.isArray(d.produtos) || !d.produtos.length || !Array.isArray(d.zonas)) d = crearDatosEjemplo(hoy());
    this.data = d;
    moverFechas(d, hoy());   // la demo siempre "vive" en el día de hoy
    this.guardar();
  },
  guardar(){
    _cache = {};
    try { localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(this.data)); } catch (e) { /* sin espacio o modo privado: sigue en memoria */ }
  },
  id(pref){ this.data.seq = (this.data.seq || 0) + 1; return pref + '_' + this.data.seq.toString(36) + Math.random().toString(36).slice(2, 5); }
};
const D = () => Store.data;
const guardar = () => Store.guardar();
function reiniciarDemo(){ localStorage.removeItem(CLAVE_GUARDADO); Store.data = null; Store.cargar(); }

/* Los datos de ejemplo se crean "alrededor de hoy". Si alguien vuelve otro día,
   se corren todas las fechas para que siga habiendo ventas hoy, lotes por vencer, etc. */
const CAMPOS_FECHA = new Set(['f', 'vence', 'alta']);
function moverFechas(d, h){
  const n = difDias(d.base, h);
  if (!n) return;
  const m = s => (typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s)) ? sumarDias(s, n) : s;
  (function recorrer(o){
    if (Array.isArray(o)) o.forEach(recorrer);
    else if (o && typeof o === 'object') Object.keys(o).forEach(k => {
      if (CAMPOS_FECHA.has(k)) o[k] = m(o[k]); else if (o[k] && typeof o[k] === 'object') recorrer(o[k]);
    });
  })([d.produtos, d.vendas, d.entradas, d.clientes, d.fornecedores, d.mov, d.emails, d.log]);
  d.base = h;
}

/* ---------- Usuario actual y permisos ---------- */
let PERFIL = null;   // clave de USUARIOS: 'gerencia' | 'deposito' | 'caixa'
const rolActual = () => PERFIL ? USUARIOS[PERFIL].rol : null;
const esGerente = () => rolActual() === 'gerente';
const veCusto = () => rolActual() !== 'caixa';        // el costo y el valor del estoque no los ve la caja
const puedeEditarMapa = () => rolActual() !== 'caixa';
function usuarioTxt(){ return PERFIL ? USUARIOS[PERFIL].nombre : '—'; }
// Toda acción queda registrada con fecha, hora y usuario.
function registrar(accion){
  const l = D().log; l.unshift({ f:hoy(), h:hora(), u:usuarioTxt(), a:accion });
  if (l.length > 600) l.length = 600;
}

/* ---------- Buscar registros ---------- */
function mapa(lista){ return memo('map_' + lista, () => { const m = {}; D()[lista].forEach(x => m[x.id] = x); return m; }); }
const produto    = id => mapa('produtos')[id];
const cliente    = id => id ? mapa('clientes')[id] : null;

/* =====================================================================
   ESTOQUE · siempre por LOTE, y cada lote está en una ZONA del mapa.
   - Al vender sale primero el lote que vence antes (PVPS: primeiro que
     vence, primeiro que sai), esté en la zona que esté.
   - Un producto puede estar repartido en varias zonas (ej.: reserva arriba).
   ===================================================================== */
const estoqueDe = p => r2(p.lotes.reduce((s, l) => s + l.c, 0));
const estoqueZona = (p, zid) => r2(p.lotes.filter(l => l.zona === zid).reduce((s, l) => s + l.c, 0));
function lotesOrdenados(p){ return p.lotes.slice().sort((a, b) => (a.vence || '9999').localeCompare(b.vence || '9999')); }
function zonasDe(p){ const s = []; p.lotes.forEach(l => { if (l.c > 0 && !s.includes(l.zona)) s.push(l.zona); }); if (!s.length && p.zona) s.push(p.zona); return s; }

function movEstoque(o){ D().mov.unshift(Object.assign({ id:Store.id('m'), f:hoy(), h:hora(), u:usuarioTxt() }, o)); }
// Saca del estoque (primero lo que vence antes). Devuelve de qué lote y zona salió cada parte.
function sacarEstoque(pid, cantidad, tipo, ref){
  const p = produto(pid); cantidad = r2(cantidad);
  if (!p || cantidad <= 0) return [];
  let resta = cantidad; const saidas = [];
  lotesOrdenados(p).forEach(l => {
    if (resta <= 0 || l.c <= 0) return;
    const q = Math.min(l.c, resta); l.c = r2(l.c - q); resta = r2(resta - q);
    saidas.push({ zona:l.zona, lote:l.lote, vence:l.vence, c:q });
  });
  p.lotes = p.lotes.filter(l => l.c > 0);
  saidas.forEach(s => movEstoque({ p:pid, c:-s.c, tipo, ref:ref || '', zona:s.zona, lote:s.lote }));
  return saidas;
}
function entrarEstoque(pid, cantidad, lote, vence, zid, tipo, ref){
  const p = produto(pid); cantidad = r2(cantidad);
  if (!p || cantidad <= 0) return;
  lote = lote || 'S/L'; zid = zid || p.zona;
  const ex = p.lotes.find(l => l.lote === lote && (l.vence || '') === (vence || '') && l.zona === zid);
  if (ex) ex.c = r2(ex.c + cantidad); else p.lotes.push({ id:Store.id('l'), lote, c:cantidad, vence:vence || null, zona:zid });
  movEstoque({ p:pid, c:cantidad, tipo, ref:ref || '', zona:zid, lote });
}
function transferirLote(pid, loteId, cantidad, destino){
  const p = produto(pid), l = p && p.lotes.find(x => x.id === loteId); cantidad = r2(cantidad);
  if (!l || cantidad <= 0 || cantidad > l.c || l.zona === destino) return false;
  const origem = l.zona;
  l.c = r2(l.c - cantidad);
  const ex = p.lotes.find(x => x !== l && x.lote === l.lote && (x.vence || '') === (l.vence || '') && x.zona === destino);
  if (ex) ex.c = r2(ex.c + cantidad); else p.lotes.push({ id:Store.id('l'), lote:l.lote, c:cantidad, vence:l.vence, zona:destino });
  p.lotes = p.lotes.filter(x => x.c > 0);
  movEstoque({ p:pid, c:-cantidad, tipo:'transferencia', ref:'Para ' + nomeZona(destino), zona:origem, lote:l.lote });
  movEstoque({ p:pid, c:cantidad, tipo:'transferencia', ref:'De ' + nomeZona(origem), zona:destino, lote:l.lote });
  return true;
}

/* ---------- Estado de cada producto: o semáforo (crítico, baixo, ok) ---------- */
const ESTADOS = {
  zerado:  { t:'Sem estoque', c:'c-rojo',     cor:'var(--rojo)' },
  critico: { t:'Crítico',     c:'c-rojo',     cor:'var(--rojo)' },
  baixo:   { t:'Baixo',       c:'c-amarillo', cor:'var(--amarillo-vivo)' },
  ok:      { t:'OK',          c:'c-verde',    cor:'var(--verde)' }
};
const ORDEN_ESTADO = { zerado:0, critico:1, baixo:2, ok:3 };
function estadoPorCantidad(p, q){ return q <= 0 ? 'zerado' : q <= p.critico ? 'critico' : q <= p.baixo ? 'baixo' : 'ok'; }
function chipEstado(e){ const x = ESTADOS[e]; return `<span class="chip ${x.c}">${x.t}</span>`; }

// Ventas por producto y por día (para promedios, estadísticas y consultas). Se arma una sola vez.
function indiceVendas(){
  return memo('iv', () => {
    const porProd = {}, porDia = {};
    D().vendas.forEach(v => {
      if (v.est === 'cancelada') return;
      porDia[v.f] = (porDia[v.f] || 0) + v.tot;
      const f = v.sub > 0 ? v.tot / v.sub : 1;
      v.it.forEach(i => {
        const x = porProd[i.p] || (porProd[i.p] = { ult:null, dias:{}, q:0, r:0 });
        if (!x.ult || v.f > x.ult) x.ult = v.f;
        x.dias[v.f] = (x.dias[v.f] || 0) + i.c;
        x.q += i.c; x.r += i.c * i.pr * f;
      });
    });
    return { porProd, porDia };
  });
}
// Unidades vendidas de un producto entre dos fechas (incluidas).
function vendidoEntre(pid, desde, hasta){
  const x = indiceVendas().porProd[pid]; if (!x) return 0;
  let s = 0; Object.keys(x.dias).forEach(f => { if (f >= desde && f <= hasta) s += x.dias[f]; });
  return s;
}
function info(p){
  return memo('inf_' + p.id, () => {
    const h = hoy(), cfg = D().config;
    const est = estoqueDe(p), estado = estadoPorCantidad(p, est);
    let vencidos = 0, vencendo = 0, proxVence = null;
    p.lotes.forEach(l => {
      if (l.c <= 0 || !l.vence) return;
      const d = difDias(h, l.vence);
      if (d < 0) vencidos = r2(vencidos + l.c);
      else { if (d <= cfg.diasVence) vencendo = r2(vencendo + l.c); if (!proxVence || l.vence < proxVence) proxVence = l.vence; }
    });
    const dias = cfg.diasAnalise || 60;
    const vendDias = vendidoEntre(p.id, sumarDias(h, -dias + 1), h);
    const mediaDia = vendDias / dias;
    const cobertura = mediaDia > 0 ? Math.floor(est / mediaDia) : null;
    const alvo = Math.max(p.baixo + p.critico, Math.ceil(mediaDia * cfg.coberturaAlvo));
    const sugestao = estado === 'ok' ? 0 : Math.max(0, Math.ceil(alvo - est));
    const iv = indiceVendas().porProd[p.id] || {};
    return { est, estado, vencidos, vencendo, proxVence, mediaDia, cobertura, sugestao, alvo, ult: iv.ult || null,
             vendMes: vendidoEntre(p.id, inicioMes(h), h), valor: Math.max(0, est) * p.custo };
  });
}
function valorEstoque(){ return memo('valor', () => D().produtos.reduce((s, p) => s + Math.max(0, estoqueDe(p)) * p.custo, 0)); }
function contarEstados(){
  return memo('cuentaEst', () => { const c = { zerado:0, critico:0, baixo:0, ok:0, vencido:0, vence:0 };
    D().produtos.forEach(p => { const i = info(p); c[i.estado]++; if (i.vencidos > 0) c.vencido++; if (i.vencendo > 0) c.vence++; });
    return c; });
}
const precisaRepor = p => ['zerado', 'critico', 'baixo'].includes(info(p).estado);

/* ---------- Zonas del mapa ---------- */
const zonasDoPiso = piso => D().zonas.filter(z => z.piso === piso);
// Lo que hay en una zona: los productos con lotes ahí, más los que tienen ahí su lugar fijo aunque estén en cero.
function resumoZona(zid){
  return memo('rz_' + zid, () => {
    const prods = [];
    D().produtos.forEach(p => {
      const q = estoqueZona(p, zid);
      if (q > 0 || p.zona === zid){
        const i = info(p);
        let venceZ = null; p.lotes.forEach(l => { if (l.zona === zid && l.c > 0 && l.vence && (!venceZ || l.vence < venceZ)) venceZ = l.vence; });
        prods.push({ p, q, estado: i.estado, venceZ, principal: p.zona === zid });
      }
    });
    prods.sort((a, b) => ORDEN_ESTADO[a.estado] - ORDEN_ESTADO[b.estado] || a.p.nome.localeCompare(b.p.nome));
    const unidades = prods.reduce((s, x) => s + x.q, 0), valor = prods.reduce((s, x) => s + x.q * x.p.custo, 0);
    const alertas = prods.filter(x => x.principal && x.estado !== 'ok').length;
    const pior = prods.filter(x => x.principal).reduce((m, x) => ORDEN_ESTADO[x.estado] < ORDEN_ESTADO[m] ? x.estado : m, 'ok');
    const vencendo = prods.filter(x => x.venceZ && difDias(hoy(), x.venceZ) <= D().config.diasVence).length;
    return { prods, unidades, valor, alertas, pior, vencendo, itens: prods.filter(x => x.q > 0).length };
  });
}

/* =====================================================================
   VENDAS (faturamento)
   Cada renglón: { p, n: nome, c: quantidade, pr: preço, co: custo,
                   sai: [{ zona, lote, c }] ← de onde saiu do estoque }
   ===================================================================== */
const vendaAtiva = v => v.est !== 'cancelada';
function nuevoNumero(tipo){ D().nums[tipo] = (D().nums[tipo] || 0) + 1; return D().nums[tipo]; }
const nfTxt = n => 'NF-e ' + String(n).padStart(6, '0').replace(/(\d{3})(\d{3})$/, '$1.$2');
function chipVenda(v){ return v.est === 'cancelada' ? '<span class="chip c-gris">Cancelada</span>' : `<span class="chip c-verde">${nfTxt(v.nf)}</span>`; }
const novoCliente = c => difDias(c.alta, hoy()) < 30;   // «novos clientes»: los dados de alta en los últimos 30 días
function ultimaCompraCli(id){ return memo('ucli', () => { const m = {}; D().vendas.forEach(v => { if (v.cli && vendaAtiva(v) && (!m[v.cli] || v.f > m[v.cli])) m[v.cli] = v.f; }); return m; })[id] || null; }
function totalCliente(id, desde){ return D().vendas.filter(v => v.cli === id && vendaAtiva(v) && (!desde || v.f >= desde)).reduce((s, v) => s + v.tot, 0); }

/* =====================================================================
   AVISOS POR E-MAIL (en la demo se simulan: quedan anotados en «Reposição»)
   En la versión real los manda Google Apps Script desde la cuenta de Wydan.
   ===================================================================== */
function emailCritico(prods){
  const cfg = D().config; if (!cfg.avisoImediato || !prods.length) return;
  const assunto = prods.length === 1 ? `Estoque crítico: ${prods[0].nome}` : `Estoque crítico: ${prods.length} produtos`;
  D().emails.unshift({ id:Store.id('e'), f:hoy(), h:hora(), para:cfg.emailAviso, tipo:'critico', assunto,
    itens: prods.map(p => ({ p:p.id, n:p.nome, est:estoqueDe(p), u:un(p), sug:info(p).sugestao, forn:nomeForn(p.forn) })) });
  avisar(`E-mail enviado para <b>${esc(cfg.emailAviso)}</b>: ${esc(assunto)}`, 'email', true);
}

function ean13(base12){ let s = 0; for (let i = 0; i < 12; i++) s += Number(base12[i]) * (i % 2 ? 3 : 1); return base12 + ((10 - s % 10) % 10); }

function crearDatosEjemplo(h){
  const rnd = azar(20261027), elegir = a => a[Math.floor(rnd() * a.length)];
  const d = { version:1, base:h, seq:0, nums:{ venda:4810, entrada:0 }, config:JSON.parse(JSON.stringify(CONFIG_INICIAL)),
    zonas:JSON.parse(JSON.stringify(ZONAS_EJEMPLO)), produtos:[], fornecedores:[], clientes:[], vendas:[], entradas:[], mov:[], emails:[], log:[], avisos:{}, ultimaSaida:null };
  Store.data = d;
  const id = p => Store.id(p);

  FORN_EJEMPLO.forEach(([fid, nome, cnpj, contato, tel, email, prazo, ciclo]) => d.fornecedores.push({ id:fid, nome, cnpj, contato, tel, email, prazo, ciclo, obs:'' }));
  const ciclo = {}; FORN_EJEMPLO.forEach(f => ciclo[f[0]] = f[7]);

  const media = {}, vidaUtil = {};
  PROD_EJEMPLO.forEach((x, i) => {
    const [nome, grupo, unid, custo, preco, critico, baixo, md, vida, , zid, forn] = x;
    const p = { id:'p' + (i + 1), cod:String(1001 + i), barras:ean13('7896' + String(48210 + i * 37).padStart(8, '0')), nome, grupo, unid, custo, preco,
      critico, baixo, zona:zid, forn, validade: vida > 0, lotes:[], alta:sumarDias(h, -400) };
    d.produtos.push(p); media[p.id] = md; vidaUtil[p.id] = vida;
  });

  d.clientes = CLI_EJEMPLO.map(([nome, tipo, doc, contato, tel, bairro, dias], i) => ({ id:'c' + (i + 1), nome, tipo, doc, contato, tel,
    email: sinTildes(nome.split(' ').slice(-2).join('')).replace(/[^a-z]/g, '') + '@email.com', bairro, alta:sumarDias(h, -dias), obs:'' }));

  /* ---------- Cinco meses de ventas (lunes a sábado) ---------- */
  const DIAS_HIST = 150, agora = new Date(), horaAgora = agora.getHours() + agora.getMinutes() / 60;
  const pesosPago = [['PIX', 34], ['Boleto', 22], ['A prazo', 14], ['Cartão de débito', 12], ['Cartão de crédito', 10], ['Dinheiro', 8]];
  const pago = () => { let r = rnd() * 100; for (const [t, w] of pesosPago){ if ((r -= w) < 0) return t; } return 'PIX'; };
  const usuarios = ['Caixa', 'Caixa', 'Caixa', 'Gerência'];
  for (let k = DIAS_HIST; k >= 0; k--){
    const f = sumarDias(h, -k), dw = diaSemana(f);
    if (dw === 0) continue;
    const crec = 0.82 + 0.18 * (1 - k / DIAS_HIST), fdia = (dw === 6 ? .65 : dw === 1 ? 1.15 : 1) * crec;
    const clientesDia = d.clientes.filter(c => c.alta <= f);
    const nVendas = Math.max(4, Math.round((10 + rnd() * 6) * fdia));
    const vendas = [];
    for (let n = 0; n < nVendas; n++){
      const hh = 8 + rnd() * 10;
      if (k === 0 && hh > Math.max(horaAgora, 10.5)) continue;   // hoy: solo lo que ya pasó (al menos media mañana)
      vendas.push({ hh, it:{} });
    }
    if (!vendas.length) continue;
    d.produtos.forEach(p => {
      let q = media[p.id] * fdia * (0.4 + rnd() * 1.2) * (k === 0 ? Math.min(1, vendas.length / nVendas) : 1);
      q = p.unid === 'kg' ? Math.round(q * 2) / 2 : Math.round(q);
      if (q <= 0) return;
      // se reparte en una o dos ventas del día
      const partes = q >= 4 && rnd() < .5 ? 2 : 1;
      for (let j = 0; j < partes; j++){
        const v = elegir(vendas), c = partes === 2 ? (j === 0 ? Math.ceil(q / 2) : Math.floor(q / 2)) : q;
        if (c > 0) v.it[p.id] = (v.it[p.id] || 0) + c;
      }
    });
    vendas.sort((a, b) => a.hh - b.hh).forEach(v => {
      const ids = Object.keys(v.it); if (!ids.length) return;
      const ajuste = 1 - Math.floor(k / 30) * 0.012;   // los precios de meses anteriores eran un poco más bajos
      const it = ids.map(pid => { const p = d.produtos.find(x => x.id === pid);
        return { p:pid, n:p.nome, c:v.it[pid], pr:r2(p.preco * ajuste), co:r2(p.custo * ajuste), sai:[{ zona:p.zona, lote:'', c:v.it[pid] }] }; });
      const sub = r2(it.reduce((s, i) => s + i.c * i.pr, 0));
      const desc = sub > 1500 && rnd() < .35 ? r2(sub * .03) : 0;
      const cli = rnd() < .88 && clientesDia.length ? elegir(clientesDia).id : null;
      d.vendas.push({ id:id('v'), num:0, nf:0, f, h:p2(Math.floor(v.hh)) + ':' + p2(Math.floor((v.hh % 1) * 60)), cli, it, sub, desc, tot:r2(sub - desc),
        pago: cli ? pago() : elegir(['Dinheiro', 'PIX', 'Cartão de débito']), u:elegir(usuarios), est:'ok' });
    });
  }
  d.vendas.sort((a, b) => (a.f + a.h).localeCompare(b.f + b.h));
  d.vendas.forEach(v => { v.num = ++d.nums.venda; v.nf = 12000 + v.num; });
  // un par de ventas canceladas, para que se vea cómo queda
  [d.vendas[d.vendas.length - 140], d.vendas[d.vendas.length - 600]].forEach(v => { if (v){ v.est = 'cancelada'; v.motivo = 'Cliente desistiu da compra'; } });
  d.vendas.reverse();   // la más nueva primero

  /* ---------- Entradas: cada proveedor entrega cada tantos días ---------- */
  const entradasPorProd = {};
  d.fornecedores.forEach((fo, fi) => {
    for (let k = DIAS_HIST - Math.floor(rnd() * fo.ciclo); k >= 1; k -= fo.ciclo){
      let f = sumarDias(h, -k); if (diaSemana(f) === 0) f = sumarDias(f, 1);
      if (f > h) continue;
      const it = [];
      d.produtos.filter(p => p.forn === fo.id).forEach(p => {
        // lo que se vendió en el ciclo (6 de 7 días abiertos, ritmo algo menor que el promedio) con un poco de variación
        let q = Math.round(media[p.id] * fo.ciclo * (6 / 7) * .9 * (0.85 + rnd() * .25));
        if (q <= 0) q = 1;
        const lote = 'L' + f.slice(2, 4) + f.slice(5, 7) + f.slice(8, 10) + String.fromCharCode(65 + (fi % 26));
        const vence = vidaUtil[p.id] ? sumarDias(f, vidaUtil[p.id]) : null;
        it.push({ p:p.id, c:q, custo:p.custo, lote, vence, zona:p.zona });
        (entradasPorProd[p.id] = entradasPorProd[p.id] || []).push({ f, lote, vence, c:q });
      });
      if (!it.length) continue;
      d.entradas.push({ id:id('en'), num:0, f, forn:fo.id, nf:String(31000 + Math.floor(rnd() * 60000)), it, tot:r2(it.reduce((s, i) => s + i.c * i.custo, 0)), u:'Depósito', obs:'' });
    }
  });
  d.entradas.sort((a, b) => a.f.localeCompare(b.f)).forEach(e => e.num = ++d.nums.entrada);
  d.entradas.reverse();

  /* ---------- El estoque de hoy: los lotes de las últimas entradas, en su zona ---------- */
  PROD_EJEMPLO.forEach((x, i) => {
    const p = d.produtos[i]; let falta = x[9];
    const lotes = (entradasPorProd[p.id] || []).slice().sort((a, b) => b.f.localeCompare(a.f));
    for (const e of lotes){
      if (falta <= 0) break;
      const c = Math.min(falta, e.c); falta -= c;
      p.lotes.push({ id:id('l'), lote:e.lote, c, vence:e.vence, zona:p.zona });
    }
    if (falta > 0) p.lotes.push({ id:id('l'), lote:'INV' + h.slice(2, 4), c:falta, vence: vidaUtil[p.id] ? sumarDias(h, Math.round(vidaUtil[p.id] * .6)) : null, zona:p.zona });
  });
  // Parte arriba, en la reserva (el lote más viejo queda abajo, a mano)
  EN_RESERVA.forEach(([i, q]) => {
    const p = d.produtos[i], l = p.lotes[0]; if (!l) return;
    const pasar = Math.min(q, l.c); l.c -= pasar;
    p.lotes.push({ id:id('l'), lote:l.lote, c:pasar, vence:l.vence, zona:'zR' });
    p.lotes = p.lotes.filter(x => x.c > 0);
  });
  // Validades para mostrar los avisos: coco ralado vence en 12 días, crema fresca en 6, requeijão con un lote ya vencido
  const lotePorNombre = (n, f) => { const p = d.produtos.find(x => x.nome.startsWith(n)); if (p && p.lotes.length) f(p); };
  lotePorNombre('Coco ralado', p => { p.lotes[p.lotes.length - 1].vence = sumarDias(h, 12); });
  lotePorNombre('Creme de leite fresco', p => { p.lotes.forEach(l => l.vence = sumarDias(h, 6)); });
  lotePorNombre('Cream cheese', p => { p.lotes[p.lotes.length - 1].vence = sumarDias(h, 19); });
  lotePorNombre('Requeijão', p => { const l = p.lotes[p.lotes.length - 1]; l.c -= 2; p.lotes.push({ id:id('l'), lote:'L' + sumarDias(h, -70).slice(2).replace(/-/g, '') + 'C', c:2, vence:sumarDias(h, -3), zona:p.zona }); });
  lotePorNombre('Leite integral UHT', p => { p.lotes[p.lotes.length - 1].vence = sumarDias(h, 24); });

  /* ---------- Avisos por e-mail ya enviados (simulados) ---------- */
  const para = d.config.emailAviso;
  const itemMail = n => { const p = d.produtos.find(x => x.nome.startsWith(n)); return { p:p.id, n:p.nome, est:estoqueDe(p), u:(UNIDADES[p.unid] || UNIDADES.un).c, sug:0, forn:(FORN_EJEMPLO.find(f => f[0] === p.forn) || [])[1] }; };
  d.emails.push({ id:id('e'), f:h, h:'08:00', para, tipo:'resumo', assunto:'Resumo do dia: produtos para repor e validades', itens:['Polvilho doce', 'Amido de milho', 'Óleo de soja · galão', 'Açúcar de confeiteiro', 'Creme de leite fresco', 'Bobina plástica'].map(itemMail) });
  d.emails.push({ id:id('e'), f:sumarDias(h, -1), h:'16:42', para, tipo:'critico', assunto:'Estoque crítico: Açúcar de confeiteiro · 1 kg', itens:[itemMail('Açúcar de confeiteiro')] });
  d.emails.push({ id:id('e'), f:sumarDias(h, -2), h:'11:15', para, tipo:'critico', assunto:'Estoque crítico: Polvilho doce · 1 kg (fardo 10 un)', itens:[itemMail('Polvilho doce')] });
  d.emails.push({ id:id('e'), f:sumarDias(h, -1), h:'08:00', para, tipo:'resumo', assunto:'Resumo do dia: produtos para repor e validades', itens:['Polvilho doce', 'Amido de milho', 'Óleo de soja · galão', 'Bobina plástica'].map(itemMail) });
  d.emails.sort((a, b) => (b.f + b.h).localeCompare(a.f + a.h));

  d.log.push({ f:h, h:'07:58', u:'Depósito', a:'Conferiu a entrada de mercadoria' });
  Store.data = null;
  return d;
}

/* ---------- Pantalla de bloqueo ----------
   IMPORTANTE: es un bloqueo VISUAL para la demostración, no una seguridad real.
   En la versión real, intentarIngreso() se reemplaza por Firebase Authentication:
     firebase.auth().signInWithEmailAndPassword(correo, clave)
   y lo que ve cada usuario se controla en firestore.rules (no en el navegador). */
let _perfilElegido = 'gerencia';
function saludo(){ const h = new Date().getHours(); return h < 12 ? 'Bom dia' : (h < 18 ? 'Boa tarde' : 'Boa noite'); }
function mostrarBloqueo(){
  $('#bq-logo').innerHTML = logoRemo();
  $('#bq-wydan').src = LOGO_WYDAN_ICONO;
  $('#bq-fecha').textContent = saludo() + ' · ' + fLarga(hoy());
  $('#bq-ojo').innerHTML = ico('ojo');
  $('#bq-pass').type = 'password'; $('#bq-pass').value = '';
  $('#bq-error').textContent = '';
  pintarPerfiles();
  $('#app').classList.add('hidden');
  $('#bloqueo').classList.remove('hidden', 'saliendo');
  if (window.innerWidth > 700) setTimeout(() => $('#bq-pass').focus(), 120);
}
function pintarPerfiles(){
  $('#bq-perfiles').innerHTML = Object.keys(USUARIOS).map(k => { const u = USUARIOS[k];
    return `<button type="button" class="bq-perfil ${k === _perfilElegido ? 'on' : ''}" role="radio" aria-checked="${k === _perfilElegido}" onclick="elegirPerfil('${k}')">
      <span class="avatar">${ico(u.ico)}</span><b>${u.nombre}</b><small>${u.desc}</small></button>`; }).join('');
}
function elegirPerfil(k){ _perfilElegido = k; pintarPerfiles(); $('#bq-pass').focus(); }
function alternarClave(){
  const i = $('#bq-pass'), ver = i.type === 'password';
  i.type = ver ? 'text' : 'password';
  $('#bq-ojo').innerHTML = ico(ver ? 'ojoNo' : 'ojo');
  $('#bq-ojo').setAttribute('aria-label', ver ? 'Ocultar senha' : 'Mostrar senha');
  i.focus();
}
function intentarIngreso(){
  const i = $('#bq-pass'), t = $('#bq-form');
  if (i.value === USUARIOS[_perfilElegido].clave){
    PERFIL = _perfilElegido;
    registrar('Entrou no sistema');
    guardar();
    $('#bq-error').textContent = '';
    $('#bloqueo').classList.add('saliendo');
    setTimeout(() => { $('#bloqueo').classList.add('hidden'); abrirApp(); }, 550);
  } else {
    $('#bq-error').textContent = 'Senha incorreta';
    t.classList.remove('sacudir'); void t.offsetWidth; t.classList.add('sacudir');
    i.select();
  }
}
function bloquear(){
  cerrarMenu(); cerrarCampana(); if (modalAbierto()) cerrarModal();

/* =====================================================================

const TIPOS_AVISO = [
  { k:'zerado',  t:'Produtos sem estoque' },
  { k:'critico', t:'Produtos em estoque crítico' },
  { k:'baixo',   t:'Produtos com estoque baixo' },
  { k:'vencido', t:'Lotes vencidos' },
  { k:'vence',   t:'Lotes perto da validade' }
];
const firmaDe = ids => ids.slice().sort().join(',');
function alertas(){   // TODAS las alertas (sin mirar lo leído ni lo apagado)
  return memo('alertas', () => {
    const a = [], P = D().produtos.map(p => [p, info(p)]), dv = D().config.diasVence;
    const lista = fn => P.filter(([p, i]) => fn(i)).map(x => x[0]);
    const zer = lista(i => i.estado === 'zerado'), cri = lista(i => i.estado === 'critico'), bai = lista(i => i.estado === 'baixo');
    const ven = lista(i => i.vencidos > 0), pv = lista(i => i.vencendo > 0);
    const ids = l => firmaDe(l.map(p => p.id));
    const ir = puedeVer('reposicao') ? "ir('reposicao')" : "verEstoque('repor')";
    if (zer.length) a.push({ k:'zerado', firma:ids(zer), n:zer.length, t: zer.length === 1 ? '1 produto sem estoque' : zer.length + ' produtos sem estoque', nivel:'rojo', ir });
    if (cri.length) a.push({ k:'critico', firma:ids(cri), n:cri.length, t: cri.length + ' em estoque crítico', nivel:'rojo', ir });
    if (bai.length) a.push({ k:'baixo', firma:ids(bai), n:bai.length, t: bai.length + ' com estoque baixo', nivel:'amarillo', ir });
    if (ven.length) a.push({ k:'vencido', firma:ids(ven), n:ven.length, t: ven.length === 1 ? '1 produto com lote vencido' : ven.length + ' produtos com lote vencido', nivel:'rojo', ir:"verConsulta('validade')" });
    if (pv.length) a.push({ k:'vence', firma:ids(pv), n:pv.length, t: pv.length + ' vencem nos próximos ' + dv + ' dias', nivel:'amarillo', ir:"verConsulta('validade')" });
    return a;
  });
}
/* Lo que elige cada usuario: qué avisos quiere y cuáles ya leyó.
   Un aviso leído vuelve a aparecer solo si cambia (por ejemplo, otro producto entra en crítico). */
function prefsAvisos(){
  const d = D(); d.avisos = d.avisos || {};
  return d.avisos[PERFIL] || (d.avisos[PERFIL] = { apagados:{}, leidos:{} });
}
const avisoLeido = x => prefsAvisos().leidos[x.k] === x.firma;
const avisoApagado = x => !!prefsAvisos().apagados[x.k];
function avisosActivos(){ return alertas().filter(x => !avisoApagado(x) && !avisoLeido(x)); }
let _verLeidos = false;
function alternarCampana(){ const p = $('#campana-panel'); if (p.classList.contains('hidden')) abrirCampana(); else cerrarCampana(); }
function abrirCampana(){
  const activos = avisosActivos(), leidos = alertas().filter(x => !avisoApagado(x) && avisoLeido(x));
  const item = (x, leido) => `<div class="cp-it ${leido ? 'leido' : ''}"><button class="cp-ir" onclick="cerrarCampana(); ${x.ir}"><span class="cp-n chip-${x.nivel}">${x.n}</span><b>${x.t}</b></button>
    <button class="cp-leer" onclick="event.stopPropagation(); marcarAviso('${x.k}', ${!leido})" title="${leido ? 'Mostrar de novo' : 'Marcar como lido'}" aria-label="${leido ? 'Mostrar de novo' : 'Marcar como lido'}">${ico(leido ? 'volver' : 'ok')}</button></div>`;
  $('#campana-panel').innerHTML = `<div class="cp-cab"><span>Avisos</span><button class="link" onclick="event.stopPropagation(); configurarAvisos()">${ico('config')} Escolher avisos</button></div>`
    + (activos.length ? activos.map(x => item(x, false)).join('') : vacio('Nenhum aviso novo.'))
    + (activos.length > 1 ? `<button class="cp-pie link" onclick="event.stopPropagation(); marcarTodos()">${ico('ok')} Marcar todos como lidos</button>` : '')
    + (leidos.length ? `<button class="cp-pie link" onclick="event.stopPropagation(); _verLeidos = !_verLeidos; abrirCampana()">${_verLeidos ? 'Ocultar' : 'Ver'} os lidos (${leidos.length})</button>` + (_verLeidos ? leidos.map(x => item(x, true)).join('') : '') : '');
  $('#campana-panel').classList.remove('hidden');

function despuesDeAvisos(){ guardar(); pintarNav(); if (seccionActual === 'inicio') RENDER.inicio(); }
function marcarAviso(k, leido){
  const x = alertas().find(a => a.k === k), p = prefsAvisos();
  if (leido && x) p.leidos[k] = x.firma; else delete p.leidos[k];
  despuesDeAvisos(); abrirCampana();
}
function marcarTodos(){ const p = prefsAvisos(); avisosActivos().forEach(x => p.leidos[x.k] = x.firma); despuesDeAvisos(); abrirCampana(); }
function prenderAviso(k, si){ prefsAvisos().apagados[k] = !si; despuesDeAvisos(); }

/* =====================================================================
   BUSCADOR GENERAL (nome, código, código de barras, cliente, fornecedor, nº de venda)
   ===================================================================== */
let _busqSel = 0;
function resultadosBusqueda(q){
  q = sinTildes(q.trim()); if (q.length < 2) return [];
  const r = [], n = q.replace(/\s/g, ''), pal = q.split(/\s+/);
  D().produtos.filter(p => { const t = sinTildes(p.nome + ' ' + p.cod + ' ' + p.grupo); return pal.every(w => t.includes(w)) || p.barras === n; }).slice(0, 7)
    .forEach(p => r.push({ g:'Produtos', t:p.nome, s:'Cód. ' + p.cod + ' · ' + cant(estoqueDe(p)) + ' ' + un(p) + ' · ' + zonasDe(p).map(nomeZona).join(', '), fn:`fichaProduto('${p.id}')` }));
  if (puedeVer('clientes')) D().clientes.filter(c => sinTildes(c.nome + ' ' + c.doc + ' ' + c.contato).includes(q)).slice(0, 5)
    .forEach(c => r.push({ g:'Clientes', t:c.nome, s:c.tipo + ' · ' + c.doc, fn:`fichaCliente('${c.id}')` }));
  if (puedeVer('fornecedores')) D().fornecedores.filter(f => sinTildes(f.nome + ' ' + f.cnpj + ' ' + f.contato).includes(q)).slice(0, 4)
    .forEach(f => r.push({ g:'Fornecedores', t:f.nome, s:'CNPJ ' + f.cnpj, fn:`fichaFornecedor('${f.id}')` }));
  D().zonas.filter(z => sinTildes(z.nome).includes(q)).slice(0, 3)
    .forEach(z => r.push({ g:'Zonas do mapa', t:z.nome, s:PISOS[z.piso].t, fn:`irAZona('${z.id}')` }));
  const num = Number(q.replace(/[^\d]/g, ''));
  if (num && puedeVer('vendas')){ const v = D().vendas.find(x => x.num === num || x.nf === num); if (v) r.push({ g:'Vendas', t:'Venda nº ' + v.num, s:fCorta(v.f) + ' · ' + reais(v.tot) + ' · ' + nomeCli(v.cli), fn:`fichaVenda('${v.id}')` }); }
  return r;
}
function pintarBusqueda(){
  const q = $('#busq-global').value, r = resultadosBusqueda(q), caja = $('#busq-res');
  if (q.trim().length < 2){ caja.classList.add('hidden'); return; }
  let g = '';
  caja.innerHTML = r.length ? r.map((x, i) => (x.g !== g ? `<div class="busq-grupo">${(g = x.g)}</div>` : '') +
    `<button class="busq-it ${i === _busqSel ? 'sel' : ''}" onclick="cerrarBusqueda(); ${x.fn}"><span>${esc(x.t)}</span><small>${esc(x.s)}</small></button>`).join('')
    : `<div class="vacio">Nada encontrado para «${esc(q)}»</div>`;
  caja.classList.remove('hidden');
}
function cerrarBusqueda(){ const c = $('#busq-res'); if (c) c.classList.add('hidden'); document.body.classList.remove('busq-movil'); }
function abrirBusquedaMovil(){ document.body.classList.add('busq-movil'); setTimeout(() => $('#busq-global').focus(), 30); }
function prepararBuscador(){
  const i = $('#busq-global');
  i.addEventListener('input', () => { _busqSel = 0; pintarBusqueda(); });
  i.addEventListener('focus', pintarBusqueda);
  i.addEventListener('keydown', e => {
    const r = resultadosBusqueda(i.value);
    if (e.key === 'ArrowDown'){ _busqSel = Math.min(r.length - 1, _busqSel + 1); pintarBusqueda(); e.preventDefault(); }
    else if (e.key === 'ArrowUp'){ _busqSel = Math.max(0, _busqSel - 1); pintarBusqueda(); e.preventDefault(); }
    else if (e.key === 'Enter' && r[_busqSel]){ e.preventDefault(); const fn = r[_busqSel].fn; i.value = ''; cerrarBusqueda(); i.blur(); new Function(fn)(); }
    else if (e.key === 'Escape'){ i.value = ''; cerrarBusqueda(); i.blur(); }
  });
}

/* ===== js/08-mapa.js ===== */
/* =====================================================================
   MAPA DO GALPÃO  (lo principal del pedido)
   - Las dos plantas (térreo y mezanino) dibujadas a partir de los planos.
   - Cada ZONA muestra la lista de lo que tiene adentro, con la cantidad y
     el semáforo. Al tocar una zona se abre su lista; al tocar un producto,
     su ficha (estoque en esa zona, lotes y validades).
   - Cuando se vende, la cantidad baja en el mapa (con una animación la
     primera vez que se abre el mapa después de la venta).
   - Las zonas se mueven y se agrandan en 09-mapa-editar.js.
   ===================================================================== */
const EST_MAPA = { piso:'terreo', zona:null, destacar:null, filtro:'', lupa:false };

// Nombre corto para que entre en la zona del mapa (sin lo de entre paréntesis y con abreviaturas comunes).
const ABREV = [[/Farinha de trigo/g, 'Far. trigo'], [/Cobertura chocolate/g, 'Cobert.'], [/chocolate/gi, 'choc.'], [/Leite condensado/g, 'Leite cond.'], [/Creme de leite/g, 'Creme leite'],
  [/Óleo de /g, 'Óleo '], [/Embalagem para/g, 'Emb.'], [/plástic[oa]/g, 'plást.'], [/Caixa de papelão para/g, 'Cx'], [/Caixa (de|para)/g, 'Cx'], [/com tampa/g, 'c/ tampa'],
  [/ para pão/g, ''], [/Saco de papel/g, 'Saco'], [/ especial panificação/g, ' especial'], [/Fermento (biológico|químico)/g, (m, t) => 'Ferm. ' + (t === 'biológico' ? 'biol.' : 'quím.')],
  [/Mistura para/g, 'Mistura'], [/Açúcar de confeiteiro/g, 'Açúcar confeit.'], [/Azeite de oliva extra virgem/g, 'Azeite extra virgem'], [/Gordura vegetal hidrogenada/g, 'Gordura vegetal'],
  [/Bandeja de isopor/g, 'Bandeja isopor'], [/Forminha de papel/g, 'Forminha'], [/Copo descartável/g, 'Copo desc.'], [/Etiqueta adesiva para balança/g, 'Etiqueta balança'], [/ tipo 1/g, ' T1'], [/ · /g, ' ']];
function nomeCurto(p, max){
  let n = p.nome.replace(/\s*\(.*?\)\s*/g, ' ');
  ABREV.forEach(([a, b]) => n = n.replace(a, b));
  n = n.replace(/\s+/g, ' ').trim();
  return n.length > max ? n.slice(0, Math.max(4, max - 1)).trim() + '…' : n;
}

/* ---------- El dibujo de la planta (paredes, columnas, escaleras, salas) ---------- */
function svgFondo(piso, mini){
  const P = PISOS[piso], pts = P.contorno.map(p => p.join(',')).join(' ');
  let s = `<polygon class="m-piso" points="${pts}"/>`;
  if (!mini){
    P.vazios.forEach(v => {
      s += `<g class="m-vazio"><rect x="${v.x}" y="${v.y}" width="${v.w}" height="${v.h}"/><path d="M${v.x} ${v.y}L${v.x + v.w} ${v.y + v.h}M${v.x + v.w} ${v.y}L${v.x} ${v.y + v.h}"/>`
        + (v.t ? `<text x="${v.x + v.w / 2}" y="${v.y + v.h / 2 - 14}" text-anchor="middle">${v.t.split(' (')[0]}</text><text x="${v.x + v.w / 2}" y="${v.y + v.h / 2 + 18}" text-anchor="middle" class="m-vazio-s">${v.t.includes('(') ? '(' + v.t.split(' (')[1] : ''}</text>` : '') + '</g>';
    });
    const xr = y => P.contorno[1][0] + (y - P.contorno[1][1]) * (P.contorno[2][0] - P.contorno[1][0]) / (P.contorno[2][1] - P.contorno[1][1]);
    P.colunas.y.forEach(y => P.colunas.x.forEach(x => { if (x < xr(y) - 30) s += `<rect class="m-col" x="${x - 8}" y="${y - 8}" width="16" height="16"/>`; }));
    P.escadas.forEach(e => {
      let deg = '';
      if (e.dir === 'v') for (let y = e.y + 14; y < e.y + e.h; y += 14) deg += `M${e.x} ${y}h${e.w}`;
      else for (let x = e.x + 14; x < e.x + e.w; x += 14) deg += `M${x} ${e.y}v${e.h}`;
      s += `<g class="m-escada"><rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}"/><path d="${deg}"/></g>`;
    });
    P.salas.forEach(sa => {
      const c = sa.pts.reduce((a, p) => [a[0] + p[0] / sa.pts.length, a[1] + p[1] / sa.pts.length], [0, 0]);
      s += `<g class="m-sala"><polygon points="${sa.pts.map(p => p.join(',')).join(' ')}"/><text x="${c[0]}" y="${c[1] - 4}" text-anchor="middle">${sa.t}</text><text x="${c[0]}" y="${c[1] + 24}" text-anchor="middle" class="m-sala-s">${sa.sub}</text></g>`;
    });
  }
  s += `<polygon class="m-pared" points="${pts}"/>`;
  if (P.portao){
    const [a, b] = P.portao, y = P.contorno[2][1];
    s += `<line class="m-portao" x1="${a}" y1="${y}" x2="${b}" y2="${y}"/>`;
    if (!mini) s += `<text class="m-rot" x="${(a + b) / 2}" y="${y + 38}" text-anchor="middle">▲ Portão de carga</text>`;
  }
  if (!mini){   // escala gráfica
    const y = P.contorno[2][1] + 34, x0 = P.contorno[0][0];
    s += `<g class="m-escala"><path d="M${x0} ${y}h${PX_METRO * 5}M${x0} ${y - 8}v16M${x0 + PX_METRO * 5} ${y - 8}v16"/><text x="${x0 + PX_METRO * 2.5}" y="${y - 12}" text-anchor="middle">5 m</text></g>`;
  }
  return s;
}

/* ---------- Una zona con su lista adentro ---------- */
function svgZona(z, o){
  const r = resumoZona(z.id), sel = EST_MAPA.zona === z.id && !o.mini, dest = EST_MAPA.destacar;
  const tieneDest = dest && r.prods.some(x => x.p.id === dest && x.q > 0);
  const cls = ['zona', z.apoio ? 'apoio' : '', sel ? 'sel' : '', tieneDest ? 'destacada' : '', (o.mini && r.alertas) ? 'alerta-' + r.pior : ''].join(' ');
  let s = `<g class="${cls}" data-id="${z.id}" ${o.mini ? '' : `onclick="elegirZona('${z.id}')"`} style="--zc:${z.cor}" tabindex="${o.mini ? -1 : 0}" role="${o.mini ? 'presentation' : 'button'}" aria-label="${esc(z.nome)}">
    <rect class="z-fondo" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="16"/>`;
  if (o.mini){
    if (!z.apoio) s += `<circle class="z-sem d-${r.pior}" cx="${z.x + z.w - 36}" cy="${z.y + 36}" r="18"/>`;
    s += `<text class="z-nome-mini" x="${z.x + 22}" y="${z.y + 52}">${esc(z.nome.length > 16 ? z.nome.slice(0, 15) + '…' : z.nome)}</text>`;
    return s + '</g>';
  }
  const hc = Math.min(z.h, 86);   // franja del título: redondeada arriba, recta abajo
  s += `<path class="z-cab" d="M${z.x} ${z.y + 16}a16 16 0 0 1 16-16h${z.w - 32}a16 16 0 0 1 16 16v${hc - 16}h${-z.w}z"/>`;
  // el nombre achica la letra para entrar entero (deja lugar al globito de alertas); si igual no entra, se corta
  const libre = z.w - (r.alertas ? 78 : 36), fs = Math.max(21, Math.min(30, libre / (z.nome.length * .56))), maxNome = Math.floor(libre / (fs * .56));
  s += `<text class="z-nome" x="${z.x + 20}" y="${z.y + 40}" style="font-size:${Math.round(fs)}px">${esc(z.nome.length > maxNome ? z.nome.slice(0, maxNome - 1) + '…' : z.nome)}</text>`;
  const maxM = Math.floor(libre / 21);   // celular: letra más grande (38) y sin la línea de abajo
  s += `<text class="z-nome-m" x="${z.x + 18}" y="${z.y + 50}">${esc(z.nome.length > maxM ? z.nome.slice(0, maxM - 1) + '…' : z.nome)}</text>`;
  if (z.apoio){
    s += `<text class="z-sub" x="${z.x + 20}" y="${z.y + 70}">Área de apoio${r.itens ? ' · ' + r.itens + ' iten' + (r.itens > 1 ? 's' : '') : ''}</text>`;
    return s + '</g>';
  }
  s += `<text class="z-sub" x="${z.x + 20}" y="${z.y + 70}">${r.prods.length} produto${r.prods.length === 1 ? '' : 's'}${r.alertas ? ` · <tspan class="z-al-${r.pior}">${r.alertas} alerta${r.alertas > 1 ? 's' : ''}</tspan>` : ''}</text>`;
  if (r.alertas) s += `<g class="z-badge d-${r.pior}"><circle cx="${z.x + z.w - 30}" cy="${z.y + 30}" r="20"/><text x="${z.x + z.w - 30}" y="${z.y + 38}" text-anchor="middle">${r.alertas}</text></g>`;
  // Computadora: la lista de productos con la cantidad. Celular: un puntito de color por producto.
  const paso = 34, top = z.y + 112, caben = Math.floor((z.h - 102) / paso);
  if (caben >= 1 && z.w >= 200){
    // el producto buscado (o recién cargado) va primero, para que nunca quede escondido en «+ N produtos»
    const orden = tieneDest || r.prods.some(x => x.p.id === dest) ? r.prods.filter(x => x.p.id === dest).concat(r.prods.filter(x => x.p.id !== dest)) : r.prods;
    const lista = orden.slice(0, orden.length > caben ? caben - 1 : caben);
    const maxC = Math.floor((z.w - 126) / 10);
    s += '<g class="z-lineas">';
    lista.forEach((x, i) => {
      const y = top + i * paso, d = x.p.id === dest;
      s += `<g class="z-linea ${d ? 'dest' : ''}" data-p="${x.p.id}" onclick="event.stopPropagation(); fichaProduto('${x.p.id}', '${z.id}')">
        <rect class="z-lin-fondo" x="${z.x + 8}" y="${y - 24}" width="${z.w - 16}" height="${paso - 2}" rx="8"/>
        <circle class="d-${x.estado}" cx="${z.x + 24}" cy="${y - 7}" r="7"/>
        <text class="z-pn" x="${z.x + 40}" y="${y}">${esc(nomeCurto(x.p, maxC))}</text>
        <text class="z-pq" x="${z.x + z.w - 18}" y="${y}" text-anchor="end"><tspan class="z-num" data-p="${x.p.id}">${cant(x.q)}</tspan> ${un(x.p)}</text></g>`;
    });
    if (r.prods.length > lista.length) s += `<text class="z-mas" x="${z.x + 40}" y="${top + lista.length * paso}">+ ${r.prods.length - lista.length} produto${r.prods.length - lista.length > 1 ? 's' : ''} · tocar para ver</text>`;
    s += '</g>';
  }
  // Celular: puntitos (uno por producto)
  const porFila = Math.max(1, Math.floor((z.w - 40) / 40));
  s += '<g class="z-puntos">' + r.prods.slice(0, porFila * Math.max(1, Math.floor((z.h - 110) / 40))).map((x, i) =>
    `<circle class="d-${x.estado} ${x.p.id === dest ? 'dest' : ''}" cx="${z.x + 34 + (i % porFila) * 40}" cy="${z.y + 126 + Math.floor(i / porFila) * 40}" r="13"/>`).join('') + '</g>';
  return s + '</g>';
}

function svgMapa(piso, o){
  o = o || {};
  const zonas = zonasDoPiso(piso);
  return `<svg class="mapa-svg ${o.mini ? 'mini' : ''}" id="${o.mini ? '' : 'mapa-svg'}" viewBox="20 -20 1100 1080" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Planta do ${PISOS[piso].t}">
    <defs><pattern id="m-grade${o.mini ? 'm' : ''}" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" class="m-grade-l"/></pattern></defs>
    <rect x="20" y="-20" width="1100" height="1080" fill="url(#m-grade${o.mini ? 'm' : ''})" class="m-papel"/>
    ${svgFondo(piso, o.mini)}
    <g id="${o.mini ? '' : 'm-zonas'}">${zonas.map(z => svgZona(z, o)).join('')}</g>
  </svg>`;
}

/* ---------- La pantalla del mapa ---------- */
RENDER.mapa = function(){
  if (EST_MAPA.zona && !zona(EST_MAPA.zona)) EST_MAPA.zona = null;
  const alertasPiso = piso => zonasDoPiso(piso).reduce((s, z) => s + resumoZona(z.id).alertas, 0);
  encabezado('Mapa do galpão', EDIT_MAPA.on ? 'Arraste as zonas para mover. Puxe o canto para mudar o tamanho.' : 'Toque numa zona para ver a lista do que tem nela. Toque num produto para ver o estoque, os lotes e as validades.',
    puedeEditarMapa() ? (EDIT_MAPA.on
      ? `<button class="btn btn-linea" onclick="nuevaZona()">${ico('mas')} Nova zona</button><button class="btn btn-prim" onclick="salirEdicionMapa()">${ico('ok')} Concluir</button>`
      : `<button class="btn btn-linea" onclick="entrarEdicionMapa()">${ico('mover')} Organizar zonas</button>`) : '');
  const pisos = Object.keys(PISOS).map(k => { const n = alertasPiso(k);
    return `<button class="${EST_MAPA.piso === k ? 'on' : ''}" onclick="cambiarPiso('${k}')">${ico('pisos')} ${PISOS[k].t}${n ? ` <span class="seg-n">${n}</span>` : ''}</button>`; }).join('');
  $('#vista').innerHTML = `
    <div class="mapa-herr">
      <div class="segmento seg-pisos">${pisos}</div>
      <div class="mapa-busca">${ico('buscar')}<input id="mapa-q" type="search" placeholder="Onde está…? (nome ou código)" autocomplete="off" value="${esc(EST_MAPA.destacar ? (produto(EST_MAPA.destacar) || {}).nome || '' : '')}" aria-label="Buscar produto no mapa">
        <div class="mapa-sug hidden" id="mapa-sug"></div>${EST_MAPA.destacar ? `<button class="mapa-limpiar" onclick="limparDestaque()" aria-label="Limpar">${ico('x')}</button>` : ''}</div>
      <button class="btn btn-linea btn-sm solo-movil" onclick="EST_MAPA.lupa = !EST_MAPA.lupa; RENDER.mapa()">${ico(EST_MAPA.lupa ? 'menos' : 'expandir')} ${EST_MAPA.lupa ? 'Ver inteiro' : 'Ampliar'}</button>
    </div>
    <div class="mapa-caja ${EDIT_MAPA.on ? 'editando' : ''}">
      <div class="card mapa-card">
        <div class="mapa-tit"><b>${PISOS[EST_MAPA.piso].t}</b><span>${PISOS[EST_MAPA.piso].sub}</span></div>
        <div class="mapa-scroll ${EST_MAPA.lupa ? 'lupa' : ''}" id="mapa-scroll">${svgMapa(EST_MAPA.piso)}</div>
        <div class="mapa-ley"><span><i class="d-ok"></i>OK</span><span><i class="d-baixo"></i>Baixo</span><span><i class="d-critico"></i>Crítico</span><span><i class="d-zerado"></i>Sem estoque</span><span><i class="ley-apoio"></i>Área de apoio</span></div>
      </div>
      <div class="mapa-panel" id="mapa-panel"></div>
    </div>`;
  prepararBuscaMapa();
  pintarPanelZona();
  if (EDIT_MAPA.on) prepararEdicionMapa();
  animarSaida();
};
function cambiarPiso(k){ EST_MAPA.piso = k; if (EST_MAPA.zona && (zona(EST_MAPA.zona) || {}).piso !== k) EST_MAPA.zona = null; RENDER.mapa(); }
function elegirZona(id){
  if (EDIT_MAPA.on){ EDIT_MAPA.sel = id; EST_MAPA.zona = id; marcarZonaSel(); pintarPanelZona(); return; }
  EST_MAPA.zona = EST_MAPA.zona === id ? null : id;
  marcarZonaSel(); pintarPanelZona();
  if (EST_MAPA.zona && window.innerWidth <= 900) setTimeout(() => $('#mapa-panel').scrollIntoView({ behavior:'smooth', block:'start' }), 60);
}
function marcarZonaSel(){ $$('#m-zonas .zona').forEach(g => g.classList.toggle('sel', g.dataset.id === EST_MAPA.zona)); }
function irAZona(id){ const z = zona(id); if (!z) return; EST_MAPA.piso = z.piso; EST_MAPA.zona = id; if (seccionActual !== 'mapa') ir('mapa'); else RENDER.mapa(); }
// Desde la ficha de un producto: «Ver no mapa»
function verNoMapa(pid, zid){
  const p = produto(pid); if (!p) return;
  const z = zona(zid || zonasDe(p)[0]); if (!z) return;
  cerrarModal();
  EST_MAPA.destacar = pid; EST_MAPA.piso = z.piso; EST_MAPA.zona = z.id;
  if (seccionActual !== 'mapa') ir('mapa'); else RENDER.mapa();
}
function limparDestaque(){ EST_MAPA.destacar = null; RENDER.mapa(); }

/* ---------- Buscar un producto en el mapa ---------- */
function prepararBuscaMapa(){
  const i = $('#mapa-q'), caja = $('#mapa-sug'); if (!i) return;
  const pintar = () => {
    const q = sinTildes(i.value.trim()); if (q.length < 2){ caja.classList.add('hidden'); return; }
    const pal = q.split(/\s+/);
    const r = D().produtos.filter(p => { const t = sinTildes(p.nome + ' ' + p.cod + ' ' + p.grupo); return pal.every(w => t.includes(w)) || p.barras === q; }).slice(0, 8);
    caja.innerHTML = r.length ? r.map(p => `<button onclick="verNoMapa('${p.id}')"><span>${esc(p.nome)}</span><small>${zonasDe(p).map(z => esc(nomeZona(z)) + ' · ' + PISOS[(zona(z) || {}).piso || 'terreo'].t).join(' + ')}</small></button>`).join('') : `<div class="vacio">Nada encontrado</div>`;
    caja.classList.remove('hidden');
  };
  i.addEventListener('input', pintar);
  i.addEventListener('focus', () => { if (EST_MAPA.destacar) i.select(); });
  i.addEventListener('keydown', e => { if (e.key === 'Enter'){ const b = $('#mapa-sug button'); if (b){ e.preventDefault(); b.click(); } } if (e.key === 'Escape') caja.classList.add('hidden'); });
}
document.addEventListener('click', e => { if (!e.target.closest('.mapa-busca')){ const c = $('#mapa-sug'); if (c) c.classList.add('hidden'); } });

/* ---------- El panel de la zona elegida (su lista) ---------- */
let _qZona = '';
function pintarPanelZona(){
  const caja = $('#mapa-panel'); if (!caja) return;
  if (EDIT_MAPA.on){ caja.innerHTML = panelEdicion(); return; }
  const z = zona(EST_MAPA.zona);
  if (!z){
    // Sin zona elegida: resumen del piso
    const zs = zonasDoPiso(EST_MAPA.piso).filter(x => !x.apoio);
    caja.innerHTML = `<div class="card"><div class="card-t">${PISOS[EST_MAPA.piso].t}<small>${zs.length} zonas de estoque · toque numa para abrir a lista</small></div>
      <div class="lista mt-s">${zs.map(x => { const r = resumoZona(x.id);
        return `<button class="fila-lista zona-fila" onclick="elegirZona('${x.id}')"><span class="zf-cor" style="background:${x.cor}"></span><span class="zf-t"><b>${esc(x.nome)}</b><small>${r.prods.length} produtos${veCusto() ? ' · ' + reaisK(r.valor) : ''}</small></span>
          ${r.alertas ? `<span class="chip ${ESTADOS[r.pior].c}">${r.alertas} alerta${r.alertas > 1 ? 's' : ''}</span>` : '<span class="chip c-verde">Tudo OK</span>'}${ico('der', 'ico-chico')}</button>`; }).join('')}</div>
      ${D().ultimaSaida ? `<div class="caja-info mt">${ico('info')}<span>Quando uma venda é faturada, a quantidade baixa sozinha na zona de onde saiu o produto.</span></div>` : ''}</div>`;
    return;
  }
  const r = resumoZona(z.id), q = sinTildes(_qZona.trim());
  const lista = r.prods.filter(x => !q || sinTildes(x.p.nome + ' ' + x.p.cod).includes(q));
  const h = hoy(), dv = D().config.diasVence;
  caja.innerHTML = `<div class="card zona-det" style="--zc:${z.cor}">
    <div class="zd-cab"><span class="zd-cor"></span><div><div class="zd-piso">${PISOS[z.piso].t}${z.apoio ? ' · área de apoio' : ''}</div><h2>${esc(z.nome)}</h2></div>
      <button class="icon-btn" onclick="elegirZona('${z.id}')" aria-label="Fechar a zona">${ico('x')}</button></div>
    <div class="zd-nums">
      <div><small>Produtos</small><b class="num">${r.prods.length}</b></div>
      <div><small>Unidades</small><b class="num">${cant(r.unidades)}</b></div>
      ${veCusto() ? `<div><small>Valor</small><b class="num">${reaisK(r.valor)}</b></div>` : `<div><small>Alertas</small><b class="num ${r.alertas ? 'neg' : ''}">${r.alertas}</b></div>`}
    </div>
    ${r.alertas || r.vencendo ? `<div class="zd-al">${r.alertas ? `<span class="chip ${ESTADOS[r.pior].c}">${r.alertas} para repor</span>` : ''}${r.vencendo ? ` <span class="chip c-amarillo">${r.vencendo} com validade próxima</span>` : ''}</div>` : ''}
    ${r.prods.length > 6 ? `<div class="buscar mt-s">${ico('buscar')}<input type="search" placeholder="Filtrar nesta zona" value="${esc(_qZona)}" oninput="_qZona=this.value; pintarPanelZona(); const i=$('#mapa-panel input'); i.focus(); i.setSelectionRange(i.value.length, i.value.length)"></div>` : ''}
    <div class="zd-lista">${lista.length ? lista.map(x => { const otras = zonasDe(x.p).filter(zz => zz !== z.id);
      const dd = x.venceZ ? difDias(h, x.venceZ) : null;
      return `<button class="zd-it ${x.p.id === EST_MAPA.destacar ? 'dest' : ''}" onclick="fichaProduto('${x.p.id}', '${z.id}')">
        <i class="dot d-${x.estado}" title="${ESTADOS[x.estado].t}"></i>
        <span class="zd-n"><b>${esc(x.p.nome)}</b><small>Cód. ${x.p.cod}${otras.length ? ' · também em ' + otras.map(o => esc(nomeZona(o)) + ' (' + cant(estoqueZona(x.p, o)) + ')').join(', ') : ''}${dd != null && dd <= dv ? ` · <span class="${dd < 0 ? 'neg' : 'am'}">${dd < 0 ? 'lote vencido' : 'vence ' + cuando(x.venceZ)}</span>` : ''}</small></span>
        <span class="zd-q"><b class="num" data-p="${x.p.id}">${cant(x.q)}</b><small>${un(x.p)}</small></span></button>`; }).join('') : vacio(z.apoio ? 'Área de apoio: aqui não fica estoque fixo.' : 'Nenhum produto nesta zona.')}</div>
    ${!z.apoio && puedeVer('entradas') ? `<div class="zd-acc"><button class="btn btn-prim btn-sm" onclick="formProduto(null, '', '${z.id}')">${ico('mas')} Novo produto aqui</button>
      <button class="btn btn-suave btn-sm" onclick="nuevaEntrada('${z.id}')">${ico('entrada')} Entrada nesta zona</button>
      <button class="btn btn-linea btn-sm" onclick="ponerEnZona('${z.id}')">${ico('transferir')} Trazer produto para cá</button></div>` : ''}
  </div>`;
}

/* ---------- La animación después de una venta: «50 → 48» ---------- */
function animarSaida(){
  const u = D().ultimaSaida;
  if (!u || u.visto || Date.now() - u.t > 30 * 60 * 1000) return;
  u.visto = true; guardar();
  const piso = EST_MAPA.piso;
  const enEste = u.itens.filter(x => (zona(x.zona) || {}).piso === piso);
  if (!enEste.length){
    const otro = u.itens.find(x => zona(x.zona));
    if (otro){ u.visto = false; EST_MAPA.piso = zona(otro.zona).piso; RENDER.mapa(); }
    return;
  }
  setTimeout(() => {
    enEste.forEach(x => {
      const g = $(`#m-zonas .zona[data-id="${x.zona}"]`); if (!g) return;
      g.classList.remove('pulso'); void g.getBBox(); g.classList.add('pulso');
      const lin = g.querySelector(`.z-linea[data-p="${x.p}"]`);
      if (lin){ lin.classList.add('baja'); contar(lin.querySelector('.z-num'), x.antes, x.depois, 1400); }
    });
    const b = $('#mapa-scroll');
    if (b){ const t = document.createElement('div'); t.className = 'mapa-toast';
      t.innerHTML = `${ico('vender')}<span><b>Venda nº ${u.num}</b> · o estoque baixou sozinho:<br>${enEste.slice(0, 4).map(x => `${esc(nomeCurto(produto(x.p), 34))}: <b>${cant(x.antes)} → ${cant(x.depois)}</b> <small>(${esc(nomeZona(x.zona))})</small>`).join('<br>')}</span>`;
      b.appendChild(t); setTimeout(() => t.classList.add('sale'), 6500); setTimeout(() => t.remove(), 7000); }
  }, 350);
}

/* ---------- Traer un producto a esta zona (cambiarle el lugar o pasar una parte) ---------- */
function ponerEnZona(zid){
  const z = zona(zid);

function moverProduto(pid, zid){

function confirmarMover(pid, zid){
  const p = produto(pid); let n = 0;
  $$('#modal-cuerpo input[data-l]').forEach(i => { const q = numero(i.value); if (q > 0 && transferirLote(pid, i.dataset.l, q, zid)) n += q; });
